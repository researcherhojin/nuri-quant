coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    # Per-flag status — shows separate backend/frontend badges in PR checks
    patch:
      default:
        target: auto

flags:
  backend:
    paths:
      - nuri/
    carryforward: true
  frontend:
    paths:
      - frontend/src/
    carryforward: true

# Ignore paths that should never count toward coverage
ignore:
  - "frontend/src/__tests__/**"
  - "tests/**"
  - "scripts/**"

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
  individual_components:
    - component_id: backend
      name: Backend (Python)
      flag_regexes:
        - backend
    - component_id: frontend
      name: Frontend (Next.js)
      flag_regexes:
        - frontend
