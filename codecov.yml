# ═══════════════════════════════════════════════════════════════
# Codecov Configuration — backend/frontend 분리 트래킹
# ═══════════════════════════════════════════════════════════════
# Codecov가 PR마다 backend/frontend 커버리지를 별도 배지로 표시
# 정책: 자동 임계값 + 1% 허용범위 (작은 변동 무시)

coverage:
  status:
    project:
      default:
        target: auto         # 직전 commit 기준 자동 비교
        threshold: 1%        # ±1% 이내 변동은 통과
    patch:
      default:
        target: auto         # 신규 코드 기준
        threshold: 5%        # 리팩토링(문자열 교체 등)에서 미커버 기존 라인 허용

# Backend = Python (nuri/), Frontend = TypeScript (frontend/src/)
flags:
  backend:
    paths:
      - nuri/
    carryforward: true       # 미수정 파일 직전 커버리지 유지
  frontend:
    paths:
      - frontend/src/
    carryforward: true

# 커버리지 계산 제외 — 테스트 코드, 스크립트, 자동 생성
ignore:
  - "frontend/src/__tests__/**"
  - "tests/**"
  - "scripts/**"

# PR comment 설정 — 변경 파일 + flag별 커버리지 표시
comment:
  layout: "diff, flags, components"
  behavior: default               # 기존 comment 업데이트 (새 comment 생성 X)
  require_changes: true           # 커버리지 변동 없으면 comment 생략

# Component 별 PR 배지
component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
  individual_components:
    - component_id: backend
      name: Backend (Python)
      flag_regexes:
        - backend
    - component_id: frontend
      name: Frontend (Next.js)
      flag_regexes:
        - frontend
