# 다단계 thesis 의 로컬 모델 런타임 계약 (#1957). 클라이언트: nuri/llm/local_client.py
#
# 근거는 Ollama 공식 문서와 2026-10-27 실측(#1957 댓글)이다:
# - 기본 context 는 문서마다 다르고(Modelfile 2048 · FAQ 4096 · context-length 페이지의 VRAM 구간) 실측도
#   기기마다 다르다(128GB 262,144 · 32GB 32,768) → 모든 옵션을 여기서 고정해 매 요청에 보낸다.
# - num_ctx 를 넘는 프롬프트는 오류 없이 앞부분이 잘린다(done_reason "stop") → 보내기 전에 거부한다.
# - 같은 프롬프트라도 캐시 적중량·기기에 따라 greedy 출력이 달라진다 → 채점 호출은 차가운 상태만,
#   기기는 실험 식별자의 일부. 버전·digest 로 못 잡는 계산 경로 변화는 canary 해시로 잡는다.
# 이 파일의 값을 바꾸면 이전 런과 비교할 수 없다 — 새 실험이다.

base_url: http://127.0.0.1:11434
model: gemma4:26b-a4b-it-qat

# 등록된 런타임 — 다르면 호출 전에 거부한다. 앱이 업데이트를 자동으로 내려받으므로 필수.
expected:
  version: 0.40.11
  digest: 2dd70431afed94dd3688d790443768c1487ed086b57147ff083851116ae4c4e4

# 공식 API 의 options. 하나라도 빠지면 서버 기본값이 끼어든다.
options:
  num_ctx: 32768
  num_predict: 1200
  temperature: 0
  seed: 42
  top_k: 40
  top_p: 0.9
think: false

# 공식 API 에 토큰 계산 엔드포인트가 없어 UTF-8 바이트를 상한으로 쓴다: 토큰 <= 바이트 + 오버헤드.
# 실측 오버헤드 13 (1바이트 프롬프트 → 14 토큰). 숫자 나열은 정확히 바이트 + 13 이었다 — 여유 3.
template_overhead_tokens: 16

timeout_s: 900
# 단계 프롬프트 상한(토큰, #1961). 기준선 A 는 압축 뷰 전체를 한 번에 받는다 — MBP 실측 7,628 + mini 의 macro_events
# ~1k + 지시 · 스키마 ~1k ≈ 10k. 8k 로 두면 A 만 증거를 덜 받아 B−A 가 정보량 비교가 된다. mini prefill 8.8k 34초 ·
# 17.6k 80초 실측, num_ctx 32,768 안. 넘으면 그 실행은 over_budget 으로 실패한다.
stage_prompt_budget_tokens: 14000

# 계산 경로 지문. 고정 공개 프롬프트를 차가운 상태 · temperature 0 으로 돌린 출력의 SHA-256.
# 채점 배치 전에 같아야 한다. null 이면 채점 배치를 거부한다 (`--canary` 로 재고 등록).
canary:
  prompt: >-
    You are writing a reference text for a numerical-stability check. Explain, in twelve numbered
    paragraphs of about one hundred words each, how bond duration, convexity, credit spreads and
    inflation expectations interact when central banks change policy rates. Use plain prose, no
    tables, and keep each paragraph self-contained.
  num_predict: 1200
  # 2026-10-27 채점 기기(mini, Ollama 0.40.11 · 위 digest)에서 `--canary` 2회 연속 같은 값. MBP 는 다른 값이 나온다
  # (기기 간 출력 차이, #1957) — 채점 배치는 mini 에서만 이 값과 대조한다.
  scored_sha256: 2ba85186f445db9f43235cc3949a07d579c738bdce333780e23a8e11b2fd94a9

archive_dir: data/thesis_runtime
