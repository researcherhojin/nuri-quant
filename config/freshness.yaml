# 데이터 신선도 SLA — warn/fail 임계 (시간 단위)
# 쿼리·라벨은 구현이므로 nuri/core/freshness.py 에 있고, **정책 숫자**만 여기 둔다.
# 키 목록은 freshness.py 의 FRESHNESS_POLICIES 와 1:1 — 어긋나면 로더가 기동 시 ValueError.
# 각 임계의 근거(주말/공휴일 여유, 잡 주기)는 freshness.py 해당 정책 주석 참조.

thresholds:
  prices: { warn_hours: 58, fail_hours: 120, warn_calendar: us_market } # 미국 D 일봉은 D+1 06:17 KST 도착(stock_us_universe_daily) → 평일 정상 최대 54.3h. 주말·NYSE 휴장일은 WARN 에서 뺀다(#1677). fail 은 그대로(주말/공휴일 감안, 금→화 = 96h)
  macro_vix: { warn_hours: 58, fail_hours: 132, warn_calendar: us_market } # holiday_calendar 없음 — CBOE 는 콜럼버스·재향군인의 날에도 VIX 를 발행하므로 연방 달력을 붙이면 진짜 정체가 그 날 24h 를 공짜로 얻는다 (#1469 Codex) # VIXCLS 도 FRED T+1 일간 시리즈 — macro_market 과 같은 물리 (#1242). 72h 는 완벽한 금요일 데이터도 월 새벽(77h)에 깨지고, FRED 경로 최악(목 관측→화 새벽)은 ~125h 라 매주 주말 상시 발화했다 (2026-08-30 실측 77.3h FAIL) # (#1677) FRED VIXCLS 가 T+1 이라 ^VIX 로 당일 행을 채운다(collectors/macro.py SAME_DAY_TAIL) — 마감된 세션만 채우므로(16:20 ET 이후) D 행은 D+1 06:00(서머타임)/07:00 KST 수집에 생겨 평일 정상 최대 ~55h — prices 와 같은 58. 주말·NYSE 휴장일은 WARN 에서 뺀다
  factors: { warn_hours: 58, fail_hours: 120, warn_calendar: us_market } # 재료가 prices 라 임계 동일 (#1071). D 가격 → D+1 08:10 KST 산출, 평일 정상 최대 56.2h
  signals: { warn_hours: 58, fail_hours: 120, warn_calendar: us_market } # technical 07:00 KST(D+1) → 평일 정상 최대 55h
  signals_kr: { warn_hours: 48, fail_hours: 120, warn_calendar: weekend } # KR 16:25 재계산 → 평일 정상 최대 40.4h. 주말만 뺀다 — 설날·추석엔 정직하게 WARN/FAIL
  fundamentals: { warn_hours: 192, fail_hours: 360 } # 주 1회 잡 — 정상 나이 168h (#1109)
  fundamentals_kr: { warn_hours: 192, fail_hours: 360 }
  macro_fear_greed: { warn_hours: 32, fail_hours: 48 } # 매일 06:07 KST 수집(#1677, 이전 08:00), date 는 KST 오늘 → 정상 최대 ~30.1h. 매시로 돌리면 같은 날 행이 장중 값으로 덮여 과거 행의 표본 기준이 바뀐다
  macro_market: { warn_hours: 84, fail_hours: 132, holiday_calendar: us_federal, warn_calendar: us_market } # 금리 3종 + put/call — 소스가 T+1 발행이라 prices(120)보다 넓다 (#1242). holiday_calendar: 미국 연방 공휴일(뉴욕 기준으로 지난 날)당 24h 면제 — 132h 는 평상 주말 실측이라 3일 연휴(노동절 2026-09-08 실측 134.5h)를 못 덮었다 (#1469). 성금요일은 연방 휴일이 아니라 면제 안 됨 — 보수적 방향의 오탐으로 둔다 # (#1677) 금리는 FRED H.15 T+1 공식값을 유지한다(yfinance ^IRX 는 2년물이 아니라 13주물, ^TNX 도 CMT 와 다른 값) — D 관측이 D+2 06:00(서머타임)/07:00 KST 수집 → 평일 정상 최대 ~79h, 84 는 한 시간 수집 지연 여유. 48 은 거의 상시 WARN 이었다
  macro_monthly: { warn_hours: 1872, fail_hours: 2160 } # 관측월(M-01) 날짜라 정상 나이가 길다: CPI 는 M+1 중순 발표 → 다음 발표 직전 나이 ~75일(1800h). 예전 fail 1800 은 그 순간과 같아 발표가 하루만 늦어도 verdict_gate 를 거짓 FAIL 로 막았다 (#1677). warn 78일 = 발표 예정보다 늦음, fail 90일 = 2주 이상 늦음
  consensus: { warn_hours: 32, fail_hours: 48 } # 매일 07:05 (주말 포함), date 는 00:00 KST 앵커 → 정상 최대 31.1h. 24 는 매일 00:00~07:05 에 WARN 이었다 (#1677)
  decisions_context: { warn_hours: 32, fail_hours: 60 } # 매일 07:05 cron — warn 은 consensus 와 동일. fail 은 (55.08, 79.08) 열린구간이어야 한다: 하루 degradation 최대 나이 55.08h 는 WARN 으로 흡수, 3차 예정 실행(79.08h) 전에는 FAIL (#1261)
  ark: { warn_hours: 168, fail_hours: 336 } # rules.yaml ark.max_source_lag_days 와 동일 (#1145)
  portfolio: { warn_hours: 24, fail_hours: 72 } # import_portfolio.py 매일 수동 실행 가정 (#507)

# /api/dashboard 한 줄 판단(verdict)이 신선도를 확인하는 입력 목록.
# 이 중 하나라도 FAIL 이면 "공격 가능" 류 판단 대신 stale 안내를 낸다 (#1180, Surface rung).
# 판단의 실제 입력만 나열: 레짐=prices, 매크로=macro_vix+fear_greed, 액션=consensus.
verdict_gate:
  - prices
  - macro_vix
  - macro_fear_greed
  - macro_market
  - macro_monthly
  - consensus
