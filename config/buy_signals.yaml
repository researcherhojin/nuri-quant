# ═══════════════════════════════════════════════════════
# BUY Signal Emitter — config (Issue #507 Phase 1)
# ═══════════════════════════════════════════════════════
# 시스템 core-purpose 결함 (sell-only) 수정 — cash deploy candidate emitter.
# `nuri/trading/recommend/buy_candidate_emitter.py` 가 이 파일을 읽음.
# 값 변경 시 코드 수정 불필요 — backtest 결과 따라 weights/thresholds 튜닝.

# ─── Source fusion weights (linear weighted, 0-1 scale per source) ──
# 합 = 1.0. composite_score 는 factors 테이블에서 (momentum/value/quality/sentiment fusion).
weights:
  factor_composite: 0.40      # 가장 신뢰 (multi-factor 이미 fused)
  momentum_5d: 0.25           # 단기 추세 — 5d % return
  technical_rsi: 0.15         # RSI < 70 정상, > 80 과열 페널티
  breakout_30d: 0.20          # 30d high 돌파 = 강한 신호
  # P2 leadership shadow — weight=0 (라이브 점수 무변경, sources 노출만).
  # 승격(weight>0)은 P1 walk-forward + max-drawdown 통과 후 별도 STRATEGY PR.
  rs_rank: 0.0                # cross-sectional RS percentile (리더 순위)
  dollar_volume: 0.0          # 거래대금 surge (crowding 가드 — 과열 추격 페널티)

# ─── Leadership 팩터 파라미터 (P2 shadow, relative_strength.compute_leadership) ──
leadership:
  lookback: 120               # RS 수익률 + 거래대금 baseline (영업일). 120d 히스토리 floor 겸용.
  surge_window: 20            # 최근 거래대금 평균 구간 (영업일)

# ─── Quality bar (final score 0-100, when to emit) ──────────────────
quality_bar:
  base_threshold: 70          # 기본 임계 — 이 이상만 emit
  # ⚠️ 키는 반드시 `nuri.quant.regime.classifier.ALL_REGIMES` 의 원소여야 한다.
  # 그 밖의 문자열은 `classify_regime()` 이 절대 내지 않으므로 `.get(regime, 0)` 이
  # 조용히 0 을 돌려주고 **조정이 통째로 무시된다** — 예외도 로그도 없다 (#1130).
  # 잠금: tests/quant/regime/test_config_regime_vocabulary.py
  per_regime:
    sideways_high_vol: +5     # 변동성 큰 regime — 더 엄격
    # 2026-08-21 제거 (#1130) — 셋 다 ALL_REGIMES 밖이라 도입 이래 한 번도 발화 못 했다:
    #   momentum_uptrend: -5   임계를 70→65 로 **여는** 방향. 도입 커밋에 백테스트 인용이
    #                          없어 근거 없이 되살리지 않는다.
    #   extreme_fear: 999      주석부터 `F&G < 20` — Fear&Greed 어휘지 레짐이 아니다.
    #                          별도 F&G 게이트로 옮길 사안.
    #   extreme_greed: +10     `euphoria` 로 개명하려면 의미가 같아야 하는데 다르다:
    #                          euphoria = `VIX < 12 AND F&G > 80` (classifier.py:241) 로
    #                          더 좁다. 개명이 아니라 정책 변경이라 백테스트 대상.
  max_candidates: 5           # 상위 N개만 emit
  min_candidates: 0           # 0이면 명시적으로 "no candidate" 출력

# ─── Hard gates (multiplicative — fail = 0 score) ───────────────────
gates:
  # VIX 게이트 임계(block 30 / caution 25)는 rules.yaml entry_rules.vix_gate 가 SSoT.
  # emitter 는 nuri.core.rules 의 VIX_BLOCK_ABOVE / VIX_CAUTION_ABOVE 를 직접 읽는다 (#760).

  # 레짐 하드 차단 — **의도적으로 비어 있다**. 레짐 축은 soft penalty(배분 축소)로만
  # 운용하고, hard veto 승격은 STRATEGY PR + 백테스트를 요구한다 (Escalation Ladder,
  # STRATEGY §2.6). risk-of-ruin 방어는 VIX > 30 하드 차단이 이미 담당한다.
  # 이전엔 코드에 `{bear, crash, extreme_fear}` 가 하드코딩돼 있었는데 셋 다
  # ALL_REGIMES 밖이라 발화 불가능했다 (#1130) — 코드에서 config 로 옮겨 승격이
  # 코드 변경이 아니라 값 변경이 되게 한다.
  blocking_regimes: []

  # #517 Phase 2b — Cooldown SELL-type split (codex+Qwen consult B3 REFINE: hard_sell 14→21d).
  # event taxonomy unified: payload.action_type ∈ {hard_sell, trim_action, position_reduce, divergence_alert}.
  # Forward-only: 신규 emit 부터 type-aware. Legacy row (NULL action_type) 는 fallback_days 적용.
  cooldown:
    hard_sell_days: 21        # SIEGE veto / stop_loss breach / alpha=FLAT — thesis 회복 시간
    trim_days: 0              # TP1 partial — re-add 허용 (50% 잔여 holding, thesis intact)
    reduce_days: 7            # cap rebalance — 기계적 사이징, 짧음
    divergence_days: 3        # divergence alert — 정보성, 빠른 회복
    fallback_days: 5          # legacy event (action_type IS NULL) — 보수적 default

  cooldown_days: 5            # DEPRECATED (#517 cooldown.fallback_days 로 대체). 호환성 유지 — 다음 세션 제거.

# ─── Allocation (regime-gated total deploy %) ──────────────────────
# 사용자 cash * total_pct = 이번 세션 deploy 추천 금액
# Phase 2: 계좌별 cash gating + 전략별 차등
allocation:
  # 레짐 미상(SPY 데이터 120h 초과 · 히스토리 부족 · 분류 실패) 시 배분. 아래 레짐별
  # 표와 **분리해 둔다** — `unknown` 은 정식 레짐이 아니라 표에 넣으면 안 된다.
  # 이 키가 생기기 전에는 미상 라벨이 `neutral` 이었고 표에 `neutral: 0.40` 이 있어서
  # 레짐을 모를 때 표에서 가장 공격적인 배분이 나갔다 (#1131).
  unknown_regime_pct: 0.10
  # ⚠️ per_regime 과 같은 제약 — 키는 ALL_REGIMES 의 원소만. 미등재 레짐은 아래
  # `default_pct` 로 떨어지고 그 사실이 WARNING 으로 남는다 (조용한 기본값 금지).
  total_pct_by_regime:
    bear_low_vol: 0.10        # soft penalty — 약세장 신규 배분 축소 (2026-08-21 #1130)
    bear_high_vol: 0.10       # soft penalty
    sideways_high_vol: 0.30
    sideways_low_vol: 0.40
    # 2026-08-21 제거 (#1130) — 전부 ALL_REGIMES 밖이라 도달 불가였다. 진짜 약세
    # 레짐은 `bear_low_vol` / `bear_high_vol` 이고 위에서 soft penalty 로 다룬다:
    #   neutral: 0.40             미상 폴백 라벨이었다 → `unknown_regime_pct` 로 이관.
    #   momentum_uptrend: 0.60    여는 방향. 근거 없어 되살리지 않음.
    #   momentum_downtrend: 0.10
    #   extreme_fear: 0.00 / extreme_greed: 0.20   F&G 어휘.
    #   bear: 0.00 / crash: 0.00  hard veto 였다 → 사용자 판정(2026-08-21)으로
    #                             soft penalty 0.10 로 대체. 0.00 복원은 백테스트 후.
  default_pct: 0.30           # 표에 없는 레짐 (bull_* · euphoria · stagflation ·
                              # recovery · sector_rotation) — 값을 지어내지 않는다
  per_candidate_method: score_weighted    # score 비중에 따라 분할 (vs equal_split)

# ─── Risk per candidate (entry/stop/TP from rules.yaml) ─────────────
# Stop -7% / TP1 +20% / TP2 +40% — canonical O'Neil growth ladder.
# rules.yaml take_profit.growth (20/40) 와 단일 출처 일치 (SSoT).
# 변경 시 rules.yaml 와 함께. test_buy_emitter_tp_ladder_matches_canonical_growth 가 lock.
# Phase 1 = growth ladder 만 적용. Phase 2: ticker 별 growth/value 분기.
risk:
  stop_pct: -7.0
  tp1_pct: 20.0
  tp2_pct: 40.0

# ─── Exclude (held tickers + ETFs not eligible) ─────────────────────
exclude_held: true            # 보유 종목은 BUY 추천 X (held_add_mode 가 Phase 2a 부터 별도 처리)
exclude_etf_leverage: true    # 아래 exclude_etfs 적용 on/off
# 레버리지/인버스 ETF — 스윙 전용이라 factor 기반 BUY 후보에서 제외 (#761).
# rules.yaml banned_etfs(SIEGE hard-ban 5종)와 목적이 다름(BUY 제외 ≠ 인증 차단).
# 모두 2x~3x 레버리지/인버스. 비레버리지(SOXX 등)는 포함하지 않는다.
exclude_etfs:
  - SOXL
  - SOXS
  - TQQQ
  - SQQQ
  - TSLL
  - TSLQ
  - UPRO
  - SPXU
  - TNA
  - TZA
  - FAS
  - FAZ
  - LABU
  - LABD

# ─── Held add-mode (#518 Phase 2a, shadow 14d) ──────────────────────
# 보유 종목에 대한 add 후보. 3 modes (precedence + mutual exclusion). spec
# §4 (docs/plans/507_buy_candidate_emitter_phase2_spec.md).
# shadow_mode_until 까지: emit → held_add_shadow 테이블 only (brief surface 없음).
# 경과 시 caller 가 brief surface 해야 하나 그 배선이 미구현(#788) — graduation 이
# 날짜로 자동 발생하면 persist(if shadow) 도 멈춰 candidate 가 buffer 없이 버려진다
# (2026-05-15~06-22 silent loss 실측). #788 calibration+surface 완료 전까지 연장해
# calibration sample 축적을 유지한다.
held_add_mode:
  enabled: true
  shadow_mode_until: "2026-12-31"   # #788 까지 연장 (축적 유지; live surface 는 #519 calibration 선결)
  earnings_blackout_days: 5         # earnings_date ± 5d 차단 (Qwen risk)

  modes:
    # precedence=1 — 최근 TRIM 후 잔여 breakout 위 add
    tp1_residual_add:
      trigger:
        last_trim_age_days_min: 5         # B1 (#517) — trim_days=0 보완
        last_trim_age_days_max: 60
        unrealized_pnl_min_factor: 1.2    # = abs(account.tp1_pct) × 1.2
        composite_score_min: 75
        require_breakout_above_last_trim_price: true   # F1 add-above-breakout
      cap_max_source: "account_strategies.<account>.max_single_position"
      max_add_pct_of_account_cash: 4
      cooldown_days: 14
      precedence: 1

    # precedence=2 — winner momentum add (cap headroom 활용)
    ride_winner:
      trigger:
        unrealized_pnl_min_factor: 2.5    # core: tp1=+20 → trigger ≥ +50 (canonical growth TP1)
        days_held_min: 30
        composite_score_min: 75
        sector_momentum_min: 5
      cap_max_source: "account_strategies.<account>.max_single_position"
      max_add_pct_of_account_cash: 5
      cooldown_days: 14
      precedence: 2

    # precedence=3 — pullback add (RSI 과매도 + macro veto)
    average_down:
      trigger:
        unrealized_pnl_min_factor: 0.3    # = account.stop_loss × 0.3 (core: -10×0.3=-3)
        unrealized_pnl_max_factor: 0.7    # = account.stop_loss × 0.7 (core: -10×0.7=-7)
        composite_score_min: 80           # 가장 높은 bar
        rsi_max: 35
        days_held_min: 14
        macro_veto: true                  # F2: 레짐 veto + 레짐 미상 veto + VIX < 28
        # 물타기를 막을 레짐. 키는 ALL_REGIMES 원소만 — 그 밖의 문자열은 조용히 무시된다.
        # **의도적으로 비어 있다**: 이전엔 코드에 `{bear, crash}` 로 하드코딩돼 있었는데
        # 둘 다 ALL_REGIMES 밖이라 발화 불가능했고(#1130), 되살리는 건 hard veto 승격이라
        # 백테스트가 선결이다 (Escalation Ladder). 레짐 **미상**은 이 목록과 무관하게
        # 항상 veto 한다 — 측정 실패는 평온의 확인이 아니다.
        macro_veto_regimes: []
      cap_max_source: "account_strategies.<account>.max_single_position"
      max_add_pct_of_account_cash: 3
      cooldown_days: 21
      precedence: 3
