# ═══════════════════════════════════════════════════════
# Nuri-Quant Alert Configuration
# ═══════════════════════════════════════════════════════

alerts:
  price_swing_pct: 3.0          # 급등락 알림 (%)
  daily_report_time: "08:00"    # KST
  rebalance_check: monthly
  fear_greed_low: 20            # 극단적 공포 → 매도 금지
  fear_greed_high: 80           # 극단적 탐욕 → 주의
  event_reminder_days: 1        # D-1 알림
  ark_alert: true

# 알림 채널 (환경변수로 토큰 설정, 미설정 시 자동 비활성)
channels:
  discord: true                 # DISCORD_WEBHOOK_URL 필요 (미설정 → stdout fallback)
  telegram: false               # TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID 필요 (기본 비활성)

# 알림 유형별 활성화
notifications:
  regime_transition: true       # 레짐 전환 시 알림
  rule_violation: true          # 투자 규칙 위반 시 알림
  signal_drift: true            # 시그널 성과 급락 시 알림
  stop_loss_alert: true         # 손절선 도달 시 알림

# ═══════════════════════════════════════════════════════
# 수집 데이터 타당성 (#966 후속) — freshness 는 **최신성만** 본다.
# `_ticker_age_hours()` 는 MAX(date) 만 읽어서, 상류가 말이 안 되는 값을 줘도
# "22시간 전 ✅" 로 통과한다. 아래는 그 사각을 **표면화만** 한다(게이트 아님).
#
# 자체 이력 분포(z-score·백분위)는 쓰지 않는다 — 진짜 폭락 때 피드가 맞는
# 바로 그 순간에 발화한다(2026-08-02 Codex 판정). 대신 (1) 물리적으로 불가능한
# OHLC 와 (2) 짝 프록시 대비 괴리만 본다.
# ═══════════════════════════════════════════════════════
data_sanity:
  enabled: true
  lookback_bars: 20             # 최근 몇 봉을 검사할지
  divergence_1d_pp: 8.0         # 같은 날 1일 수익률이 프록시와 이만큼 벌어지면 경고
  divergence_3d_pp: 12.0        # 3일 누적 괴리 임계 (매일 조금씩 틀린 피드는 1일 임계를 안 넘는다)
  proxy_max_lag_days: 5         # 프록시가 이보다 뒤처지면 "검사 불가" — 묵은 겹침으로 통과 금지
  # outbox dedupe 는 pending 행만 막으므로, 발송된 뒤엔 매일 다시 올라온다.
  # 상시 조건(프록시 미수집)을 매일 알리면 알림 피로로 전체가 무시된다.
  repeat_days_finding: 1        # 실제 이상 — 매일 다시 알린다 (조치 대상이다)
  repeat_days_unavailable: 7    # 검사 불가 — 주 1회. 잊히지 않을 만큼만, 소음이 안 될 만큼
  # 짝 프록시 — 같은 시장을 다른 경로로 재는 시리즈. 데이터가 없으면 괴리 검사를
  # 못 하는데, 그 사실 자체를 알린다(조용히 통과하는 검사가 이 레포의 반복된 실패다).
  proxies:
    KOSPI: 069500.KS            # KODEX 200. ⚠️ 현재 prices 에 0행 — 수집 시작 전까지 검사 불가
