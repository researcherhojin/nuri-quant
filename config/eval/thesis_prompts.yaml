# 동결 평가 프롬프트 — thesis_query A/B (로컬 모델 교체 판단용)
#
# 왜 동결하는가: 모델을 바꿀 때마다 "느낌상 나아졌다"로 판단하면
# `docs/STRATEGY.md` §5.10 "Model 변경 시 reliability 변동 측정 0" 상태가 영구화된다.
# 이 파일은 그 측정의 고정 입력이다. **한 번 정하면 바꾸지 않는다** —
# 프롬프트가 바뀌면 이전 측정과 비교가 불가능해진다. 추가는 허용, 수정/삭제는 금지.
#
# 프라이버시: 전부 합성 데이터. 실제 보유 종목·수량·평단이 들어가면
# `scripts/verify/check_privacy_leak.py` 가 커밋을 막고, 애초에 평가 픽스처가
# 포트폴리오를 유출하면 안 된다. 티커는 AAA~JJJ 플레이스홀더.
# 티커 바로 뒤에 부호 있는 % 를 붙이지 말 것 (TICKER_PNL_ADJACENT 규칙).
#
# 채점 대상 (scripts/dev/llm_ab_eval.py):
#   - hard failure: 날조된 가격 레벨 / 잘못된 verdict 라벨 / 포맷 붕괴
#   - grounding:    출력의 수치가 context 에 실재하는 비율
#   - latency:      TTFT + 총 wall time

version: 2
frozen_at: "2026-08-12"    # v1 10개 동결 시점
v2_added_at: "2026-08-13"  # v2 적대적 40개 추가 (v1 은 수정하지 않음)

# 필수 출력 라벨 — thesis_query._build_prompt 의 "Required output" 1번과 일치
valid_verdicts:
  - "STRONG BUY"
  - "BUY"
  - "HOLD"
  - "AVOID"
  - "SELL"

# 출력에 반드시 존재해야 하는 섹션 키워드 (포맷 붕괴 판정)
# `Price levels` 가 여기 있어야 하는 이유: 없으면 모델이 그 섹션을 통째로
# 빼먹는 것으로 가격 날조 검사를 회피할 수 있다 (codex [P1]). 레벨이
# unavailable 인 프롬프트에서도 "Price levels: unavailable" 처럼 **헤딩은
# 내야** 한다 — 그래야 회피와 정직한 보고가 구분된다.
#
# 2026-08-13: 이 줄이 한 번 조용히 사라진 적이 있다. v2 병합 중 YAML 이 깨져
# `git checkout` 으로 되돌렸는데 커밋 안 된 추가분이 같이 날아갔고, 테스트가
# 하드코딩 CFG 를 쓰는 바람에 초록불이었다. 50 프롬프트 런 하나가 이 검사
# 없이 돌았다. **테스트는 이 파일을 읽어야 한다** —
# tests/scripts/test_llm_ab_eval.py::TestShippedConfig 가 그 잠금이다.
required_sections:
  - "Verdict"
  - "Thesis"
  - "Risk"
  - "Price levels"
  - "Confidence"

