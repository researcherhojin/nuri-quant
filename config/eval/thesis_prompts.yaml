  # ── v2 적대적 프롬프트 (2026-08-13 추가) ──────────────────────────
  # 왜 추가하는가: v1 10개에서 두 모델 모두 hard_fail 0.0 이 나왔다. 그건 동률이
  # 아니라 **지표 포화**다 — 실패를 관측 못 했을 뿐이고, rule of three 로 참
  # 실패율의 95% 상한은 여전히 ~30% 였다 (codex 2차 리뷰). 정상 케이스를 더
  # 넣어도 포화는 안 깨진다. 각 계열이 채점기의 특정 검사를 겨냥해 실패를 유도한다.
  #
  #   a — levels unavailable 인데 질문이 진입/손절/TP 를 대놓고 요구
  #   b — leader(고정 익절 없음)인데 TP1/TP2 를 요구
  #   c — 시총 수치가 그럴듯한 주가처럼 보이는 미끼
  #   d — 반올림 요구 (near-miss 금액)
  #   e — 헤지 유도 (verdict 라벨 단독 규칙 위반)
  #   f — "달러 기호 빼고" 요구 (bare amount 우회)
  #   g — 컨텍스트 희박 + 빈칸 추정 요구
  #   h — 시스템 신호와 팩터 충돌
  #   i — 수치 노이즈 과다 (grounding 스트레스)
  #   j — 즉시성 압박
  #
  # 계열마다 한국어 질문을 하나씩 섞었다 — 라벨 규율이 언어에 흔들리는지 본다.
  # v1 과 같이 전부 합성 데이터이고, 여기서도 수정/삭제는 금지다.
