# ═══════════════════════════════════════════════════════
# Nuri-Quant Investment Rules
# ═══════════════════════════════════════════════════════
# 이 파일의 값을 변경하면 코드 수정 없이 투자 규칙이 변경됩니다.
# 백테스트 시 다른 규칙 세트를 시험하려면 이 파일을 복사 후 수정.
#
# 근거: O'Neil(CAN SLIM), Minervini(SEPA), 학술 연구(처분효과),
#       11년 백테스트(트레일링 스톱 15-20% 최적), 6개 외부 사이트 종합분석
#       (dataroma, tradingeconomics, macrotrends, tipranks, etf.com, ark-funds)

# ─── 포지션 한도 ────────────────────────────────────────
position_limits:
  max_single_position: 0.15     # 단일 종목 최대 비중 (15%)
  max_sector_exposure: 0.35     # 섹터 최대 노출 (35%)
  min_cash_reserve: 0.20        # 최소 현금 비중 (20%) — 긴급 기회 대비

# ─── 손절 규칙 ──────────────────────────────────────────
# 원칙: 손실은 짧게 자르기. 감정 배제, 기계적 실행.
#
# 주의: `per_stock: -7` 은 `account_strategies.core.stop_loss: -7` 와 동일한 값이
# 서로 다른 경로로 로드됨. `STOCK_STOP_LOSS` (global) 는 legacy fallback 이고,
# `get_stop_loss_for_account(account)` 가 실제 per-account threshold resolver.
# 두 값이 divert 하면 core 계좌의 global fallback path 가 잘못된 threshold 를
# 집어올 수 있음 → 변경 시 둘 다 업데이트 필수. 향후 PR 에서 single source 로
# 통합 예정 (derive `STOCK_STOP_LOSS` from core strategy).
stop_loss:
  per_stock: -7                 # 종목별 손절선 (%) — O'Neil: -7~8%. core 전략 default 와 동기화.
  per_stock_value: -10          # 가치주 손절선 (%) — 변동성 감안 완화
  portfolio: -10                # 포트폴리오 전체 손절선 (%)

# ─── 계좌별 전략 프로파일 ──────────────────────────────
# portfolio.yaml의 strategy 필드와 매칭. 기본값 = core.
account_strategies:
  core:
    stop_loss: -7
    max_single_position: 0.15
    max_sector_exposure: 0.35
    description: 핵심 보유, 정석 운용
  active:
    stop_loss: -10                # 손실은 짧게 (-7~-15 사이)
    max_single_position: 0.25     # 위너는 키움 (15~30 사이)
    max_sector_exposure: 0.45
    trailing_stop_arm: 15         # +15% 도달 시 트레일링 스톱 자동 발동
    description: 적극 운용 — 손실은 짧게, 수익은 보호하며 길게
  swing:
    stop_loss: -15
    max_single_position: 0.30
    max_sector_exposure: 0.50
    description: 스윙 기회, 공격적 허용
  long_term:
    stop_loss: -20
    max_single_position: 0.25
    max_sector_exposure: 0.50
    description: 장기 보유, 변동성 감수
  pension:
    stop_loss: -30
    max_single_position: 0.40
    max_sector_exposure: 0.60
    description: 연금 ETF, 초장기 리밸런싱

# ─── 익절 규칙 ──────────────────────────────────────────
# 원칙: 수익은 길게 가져가되 체계적으로 확보.
# 손익비 최소 3:1 유지 (손절 -7% 대비 익절 +20% = 약 3:1)
take_profit:
  # 성장주 (TSLA, NVDA, PLTR, RKLB, IONQ, TEM 등)
  growth:
    target_1: 20                # 1차 익절: +20%에서 보유량 50% 매도
    target_2: 40                # 2차 익절: +40%에서 추가 25% 매도
    remainder: trailing_stop    # 나머지 25%는 트레일링 스톱 추적
  # 가치주 (GOOGL, LLY, ORCL, MSFT, AMZN 등)
  value:
    target_1: 15                # 1차 익절: +15%에서 보유량 50% 매도
    target_2: 30                # 2차 익절: +30%에서 추가 25% 매도
    remainder: trailing_stop    # 나머지 25%는 트레일링 스톱 추적
  # 스윙 트레이드 (단기 5~20일)
  swing:
    target_1: 5                 # 1차 익절: +5%에서 보유량 50% 매도
    target_2: 10                # 2차 익절: +10%에서 나머지 전량 매도
    stop_loss: -5               # 스윙 손절 기준 (%)
    max_hold_days: 7            # 최대 보유일
    min_scan_score: 20          # 최소 스캐너 점수
    min_agent_confidence: 50    # 최소 에이전트 합의 신뢰도
  # O'Neil 8주 규칙: 매수 후 3주 이내에 +20% 돌파 시 최소 8주 보유
  eight_week_hold: true
  # ─── Leader exception (8주 룰 운영화) — DISABLED by #715 ─────
  # 의도: 성장주 보유는 고정 +20/+40 익절 대신 trail_ma 종가 이탈 청산 (승자 run).
  # 도입 근거(#679)는 17 성장주 약식 백테스트(무TP+MA50 위험조정 0.30→0.53)뿐이었다.
  # #715 엄밀 검증(2026-06-22): growth 197종목·random entries 2000·permutation null 200·
  # holdout 20%·비용·survivorship haircut walk-forward → e1_leader_ma Sharpe +0.226 vs
  # e0_ladder +0.543 (Δ−0.318, p=0.552 노이즈, maxDD −0.29 vs −0.23). promotion-eligible
  # NONE. 17종목 근거를 강한 표본이 반증 → 라이브 정당화 실패. enabled=false 로 검증된
  # O'Neil ladder 복원이 데이터 기반 디폴트 (사전등록 프로토콜). 코드는 보존 — validated
  # leader-entry 조건부 재검증 시 재활성(follow-up). 성장주 판정/50일선 로직 불변.
  leader:
    enabled: false                # #715 FAIL → ladder 복원. 재활성은 STRATEGY PR + 재검증 PASS
    trail_ma: 50                  # 50일 이동평균 종가 이탈 시 청산 (재활성 시 사용)

# ─── 트레일링 스톱 ──────────────────────────────────────
# 근거: 11년 백테스트에서 15-20% 트레일링 스톱이 최적 수익 (73.9% 누적)
trailing_stop:
  growth: -15                   # 성장주: 고점 대비 -15%
  value: -15                    # 가치주: 고점 대비 -15%
  volatile: -20                 # 고변동 종목: 고점 대비 -20%

# ─── 매수 진입 조건 ─────────────────────────────────────
# 레짐 기반 포지션 사이징
entry_rules:
  # VIX + Fear&Greed 기반 현금 비중
  regime_cash:
    extreme_fear: 0.60          # F&G < 20: 현금 60% (방어적)
    fear: 0.40                  # F&G 20-40: 현금 40%
    neutral: 0.25               # F&G 40-60: 현금 25%
    greed: 0.20                 # F&G 60-80: 현금 20% (최소 유지)
    extreme_greed: 0.40         # F&G > 80: 현금 40% (과열 주의)
  # VIX 기반 진입 게이트
  vix_gate:
    block_above: 30             # VIX > 30: 신규 매수 금지
    caution_above: 25           # VIX 25-30: 절반 포지션만
    normal_below: 20            # VIX < 20: 정상 포지션
  # 분할 매수 규칙
  scaling_in:
    max_tranches: 3             # 최대 3회 분할 매수
    tranche_interval_days: 5    # 분할 간격 최소 5일

# ─── 매도 우선순위 ──────────────────────────────────────
# 포트폴리오 정리 시 매도 순서
sell_priority:
  - leverage_etf                # 1순위: 레버리지/인버스 ETF
  - stop_loss_exceeded          # 2순위: 손절선 초과 종목
  - no_superinvestor            # 3순위: 슈퍼투자자 0명 + 적자 기업
  - position_limit_exceeded     # 4순위: 비중 한도 초과 종목
  - sector_limit_exceeded       # 5순위: 섹터 한도 초과

# ─── 레버리지 제한 ──────────────────────────────────────
leverage:
  banned_etfs:
    - TSLL
    - TQQQ
    - SQQQ
    - UPRO
    - SPXU
  max_holding_days: 5           # 레버리지 ETF 최대 보유일 (스윙만 허용)
  max_leverage: 1.5             # long_exposure / cash 최대 배수 (ExecutionFirewall leverage_cap)

# ─── 실행 우선순위 ──────────────────────────────────────
# 근거: 하락 모멘텀 종목의 1시간 지연 = 추가 손실 확정.
#       상승 모멘텀 종목의 1시간 지연 = 추가 수익 가능.
#       "출혈 차단이 수익 확정보다 선행" — 감정이 아닌 재무 논리.
execution_priority:
  order:
    - stop_loss            # 1순위: 손절 (손실률 절대값 큰 것부터)
    - take_profit          # 2순위: 익절 (타겟 초과율 큰 것부터)
    - trailing_stop_set    # 3순위: 트레일링 스톱 설정
    - new_buy              # 4순위: 신규 매수
  stop_loss_sort: loss_pct_desc     # 손실률 절대값 내림차순 (가장 큰 출혈 먼저)
  take_profit_sort: excess_pct_desc # 타겟 초과율 내림차순 (가장 많이 넘긴 것 먼저)

# ─── 매수 체크리스트 ────────────────────────────────────
# 매수 전 최소 확인 항목 (자동화 대상)
buy_checklist:
  min_tipranks_consensus: "moderate_buy"   # TipRanks 최소 Moderate Buy
  min_superinvestors: 3                     # 슈퍼투자자 최소 3명 보유
  max_pe_ratio: 100                         # PE 100 이상 = 투기 경고
  min_revenue_growth: 0                     # 매출 > $0 (프리레비뉴 기업 금지)
  require_factor_top50pct: true             # 멀티팩터 상위 50% 이내

# ─── Strategic Asset Allocation (SAA) — long-term policy mix ─────────
# 근거: docs/STRATEGY.md §3.10. Brinson-HBB (1986) + Ibbotson-Kaplan (2000)
# variance 보정 + Vanguard 2024 + Ilmanen 2022 (low expected return).
# Phase 1 skeleton — Phase 2 에서 nuri/analysis/rebalance_advisor.py 가 drift 계산에 활용.
# account_strategy 별 자산 클래스 장기 target 비중. percent (합=100).
# Drift threshold: ±5% deviation → REBALANCE 권고 (alpha_action=FLAT 절대 X, §3.7).
strategic_allocation_targets:
  core:                         # 정석 운용 (Vanguard 3-fund 변형 + KR 추가)
    us_equity: 50
    kr_equity: 20
    bond:      20
    commodity:  5
    cash_min:   5
  active:                       # 적극 운용 (equity ↑)
    us_equity: 60
    kr_equity: 20
    bond:      10
    commodity:  5
    cash_min:   5
  swing:                        # 단기 회전 (cash buffer ↑)
    us_equity: 50
    kr_equity: 30
    bond:       5
    commodity:  5
    cash_min:  10
  long_term:                    # 장기 안정 (bond ↑)
    us_equity: 40
    kr_equity: 20
    bond:      30
    commodity:  5
    cash_min:   5
  pension:                      # 연금 (Vanguard target-date glide path 60대 기준)
    us_equity: 30
    kr_equity: 15
    bond:      45
    commodity:  5
    cash_min:   5

# Rebalance cadence (Morningstar Mind the Gap 2024 / Vanguard 2024 권고: discipline 우선)
rebalance_policy:
  drift_threshold_pct: 5         # ±5% deviate → 정기 rebalance 권고
  drift_emergency_pct: 10        # ±10% deviate → 비정기 즉시 권고 (regime 전환 시도 sync)
  cadence: quarterly             # 분기 1회 (3/6/9/12 첫 영업일)
  behavior_gap_warning: true     # 시장 timing 시도 시 경고 emit (DALBAR/Morningstar 격차 ~1-3%/yr)

# ─── SIEGE Gate 정책 (v2: Asset Class 차원) ────────────────
# 근거: docs/CERTIFICATION_SPEC.md §4. Issue #248.
# Gate #5 (data_fresh), #7 (volatility / 구 vix_gate), #8 (external_data) 는
# 포트폴리오를 asset_class 별로 group 한 뒤 각 group 에 해당 정책을 적용한다.
# primary 실패는 현 severity 유지, secondary 는 warning only (cross-market
# spillover 인지용). primary 를 error 로 올리려면 STRATEGY 개정 + 백테스트.
#
# Cross-market 의도: KR 종목 보유자에게 SPY/VIX 도 영향 (상관 > 0.5).
# secondary 지표는 "US spillover / KR spillover" 를 명시적으로 경고로 노출.
siege_gates:
  # 포트폴리오 holdings 를 asset_class 로 분류. 위에서부터 순서대로 matching —
  # 더 구체적인 rule 우선. default 는 마지막.
  asset_class_rules:
    - match: {sector_prefix: "ETF/USIndex"}
      asset_class: us_equity
    - match: {sector_prefix: "ETF/USTech"}
      asset_class: us_equity
    - match: {sector_prefix: "ETF/Commodity"}
      asset_class: commodity
    - match: {sector_prefix: "ETF/Bond"}
      asset_class: bond
    - match: {sector_prefix: "ETF/KRIndex"}
      asset_class: kr_index
    - match: {ticker_suffix: ".KS"}
      asset_class: kr_equity
    - match: {ticker_suffix: ".KQ"}
      asset_class: kr_equity
    - match: {sector: "ETF"}
      asset_class: us_equity
    - match: {default: true}
      asset_class: us_equity

  # Asset class 별 gate 정책. 현 PR: kr_equity + us_equity primary path.
  # commodity/bond/kr_index 는 external_applicable:false — 애널리스트 컨센서스/13F 가
  # 구조적으로 비적용인 자산군이라 external 게이트를 N/A(vacuous pass)로 처리.
  # (kr_equity 는 적용 유지 — 커버리지는 존재하나 KR external collector 미구현 → warning 정직)
  asset_classes:
    us_equity:
      freshness_primary: SPY
      freshness_secondary: []              # US leader — cross-ref 없음
      freshness_max_hours: 72
      volatility_primary: vix
      volatility_primary_threshold: 30     # VIX > 30 → 매수 warning
      volatility_secondary: []
      external_min_records: 10
      external_min_sources: 3
    kr_equity:
      freshness_primary: KOSPI
      freshness_secondary: [SPY]           # US spillover (KR 은 follower)
      freshness_max_hours: 72
      volatility_primary: usd_krw_3d_change
      volatility_primary_threshold: 3.0    # USD/KRW 3d 변동 > 3% → 매수 warning
      volatility_secondary: [vix]          # US 변동성 전이
      volatility_secondary_threshold: 30
      external_min_records: 5              # KR 외부 소스 부족 — 완화
      external_min_sources: 2
    kr_index:
      # KOSPI ETF 계열 (예: 292160.KS). 지수 ETF 는 국지 변동성 + US 교차.
      freshness_primary: KOSPI
      freshness_secondary: [SPY]
      freshness_max_hours: 72
      volatility_primary: kospi_3d_change
      volatility_primary_threshold: 5.0
      volatility_secondary: [usd_krw_3d_change]
      volatility_secondary_threshold: 3.0
      external_applicable: false           # 지수 ETF — 종목별 애널리스트 컨센서스 N/A
    commodity:
      freshness_primary: "GC=F"            # gold futures
      freshness_secondary: []
      freshness_max_hours: 72
      volatility_primary: gold_3d_change
      volatility_primary_threshold: 5.0
      volatility_secondary: []
      external_applicable: false           # 원자재 — 애널리스트 컨센서스/슈퍼투자자 13F N/A
    bond:
      freshness_primary: TLT
      freshness_secondary: []
      freshness_max_hours: 120             # 채권 데이터 주말/이벤트 갭 허용
      volatility_primary: yield_3d_change
      volatility_primary_threshold: 0.3
      volatility_secondary: []
      external_applicable: false           # 채권 ETF — 애널리스트 컨센서스 N/A

  # E3-3c (PR TBD) — regime-adaptive position cap multipliers.
  # STRATEGY §3.6 Stage 2 PASS verdict (#402, paired counterfactual N=254,
  # 60d 95% CI [+0.0153, +0.1588]% → 60d mean ~+0.5%/year annualized) 가
  # justify. Codex Round 1 권장 scope: per_position_max **only** —
  # max_sector_exposure 는 portfolio simulator (E3-4) 후로 deferral
  # (single-position model 로 검증 불가).
  #
  # Mechanics: _check_position_limits 가 현재 regime 조회 → multiplier 적용
  # → effective_max = base_max × multiplier (account 별). 절대 cap 으로
  # overflow 방지. Hard veto (VIX>30 신규 매수 차단) 는 별도 volatility_gate
  # 에 그대로 — override 불가 (§2.6 Hard veto = policy-level).
  #
  # Neutral regime (sideways_*, sector_rotation, bear_low_vol) 는 미정의 =
  # 1.0 default. classify_regime 실패 (data gap) → 1.0 fallback.
  regime_overrides:
    # Aggressive — Stage 2 paired counterfactual 에서 favorable forward outcome
    bull_low_vol:
      per_position_max_multiplier: 1.20
    recovery:
      per_position_max_multiplier: 1.20
    # Conservative — high-vol, late-cycle, stagflation 에서 size-down
    bear_high_vol:
      per_position_max_multiplier: 0.80
    bull_high_vol:
      per_position_max_multiplier: 0.80
    stagflation:
      per_position_max_multiplier: 0.80
    euphoria:
      per_position_max_multiplier: 0.80
    # Neutral regime 은 미정의 = 1.0 default (sideways_*, sector_rotation,
    # bear_low_vol)

  # Safety cap: multiplier × base_max 이 이 % 초과 시 cap 으로 clip.
  # pension(40%) × 1.20 = 48% — under 50, OK. 만약 future strategy 가
  # base_max 50%+ 가 되면 이 cap 도 함께 재검토.
  regime_override_absolute_cap_pct: 50.0

# ─── Symmetric Amplifier (E3, STRATEGY §2.6 4번째 rung) ─────────
# 근거: docs/plans/E3_symmetric_amplifier_design.md
# 사용자 -₩7M 손실 (4월 2026) 후 시스템 redesign — 회복기 공격 amplifier 부재 fix.
# Codex consult 2026-04-28 session 019dd3f6 (3.14M tokens).
#
# Phase 1 (현재): SHADOW only — telemetry 만 emit, 실제 conf/size 변경 없음.
# Phase 2: Stage 2 paired counterfactual on 20d breakout entries.
# Phase 3: Alpha-amplified live (conf boost only).
# Phase 4: Portfolio-amplified live (Kelly quarter cap × 1.5).
#
# Anti-revenge guardrails (영구 룰):
#   - drawdown × multiplier 형식 금지 (revenge trading)
#   - 단일 조건 발동 금지 (§2.6 운용 원칙)
#   - Stage 2 paired counterfactual PASS 전 live 금지 (§3.6)
#   - Hard veto (VIX>30, risk veto, leverage_ban) 우회 금지
symmetric_amplifier:
  # 마스터 스위치 — Phase 1 shadow 출시까지 false 유지.
  # Phase 3 alpha live 시 true 로 전환 (Stage 2 PASS 후).
  enabled: false

  # Shadow mode: 모든 조건 평가하고 pipeline_events 에만 emit.
  # 실제 confidence/size 변경 안 함. enabled=true 라도 shadow_mode=true 면
  # surface-only 동작 (§2.6 1단계 Surface).
  shadow_mode: true

  # Q2: Multi-condition gate. mandatory 2개 + optional 3개. 4/5 충족 시 fire.
  # 단일 조건 발동 차단 (§2.6 anti-pattern).
  conditions:
    recovery_confirmed:
      # Q1: prior_stress AND repair_persisted state machine
      # 상세 spec: nuri/quant/regime/recovery_detector.py
      mandatory: true
    vix_favorable:
      mandatory: true
      threshold_max: 22           # VIX < 22
      slope_must_be_negative: true # 3d slope < 0
    regime_favorable:
      mandatory: false
      allowed_regimes:
        - bull_low_vol
        - recovery
      min_confidence: 0.60
    entry_strength:
      mandatory: false
      # Phase 1: price-only 20d breakout (factors 데이터 부족)
      # Phase 2 Stage 2 시 frozen entry source.
      source: breakout_20d
    macro_benign:
      mandatory: false
      event_score_max_abs: 10
  minimum_satisfied: 4              # of 5 conditions

  # Q3: Cap derivation. base = quarter-Kelly (MacLean/Thorp/Ziemba 2011).
  # NOT drawdown-based (revenge trading 차단).
  cap:
    base: quarter_kelly             # NOT drawdown × multiplier
    amp_mult_max: 1.5               # baseline × 1.5 hard cap
    respect_account_max: true       # account.per_position_max 절대 cap

  # Q6: Alpha amplifier (confidence boost only).
  alpha:
    confidence_boost_pct: 20        # base conf × 1.20 (Phase 3 활성)
    confidence_max: 95

  # Q6: Portfolio amplifier (size boost). alpha LONG 필수 의존.
  portfolio:
    requires_alpha_long: true        # alpha_amplified 없이 portfolio fire 금지
    requires_certify_pass: true      # SIEGE PASS 만

  # Q5: Hard veto + caution zone 우회 금지. VIX 25-30 에서는 amplifier 완전 비활성.
  caution_zone:
    vix_min: 25
    vix_max: 30

  # Q7: Kill-switch — trailing 30d paired excess 음수 시 자동 강등.
  # min_sample 미달 시 발동 안 함 (false negative 방지).
  kill_switch:
    enabled: true
    min_sample: 10                  # n_amplified ≥ 10 누적 후 평가
    trigger_paired_excess_negative: true
    trigger_ci_lower_negative: true
    trigger_cvar_ratio_max: 1.5     # amplified CVaR / baseline CVaR
    cooldown_days: 30

# ─── Holdings Monitor (post-entry technical-divergence gap) ─────
# Codex Plan consult 2026-04-29 (B branch). 진입-단계 보호 (PR #303
# divergence penalty + risk_agent veto) 와 별개로, 이미 매수한 종목이
# falling-knife 패턴으로 turn 했을 때 surface 하는 alert layer.
# Auto-trade 안 함 — STRATEGY §7.1 영구 deferred 와 정합 (REVIEW CTA only).
#
# 운용:
#   - 매일 07:10 KST (consensus 07:05 직후) APScheduler job 실행
#   - portfolio DB table 의 holdings × TechnicalAgent → trigger 평가
#   - Alert 발동 시 pipeline_events 에 기록 + Discord/Telegram surface
holdings_monitor:
  enabled: true

  # Trigger 1: TechnicalAgent SELL (직접 약세 시그널)
  technical_sell_min_confidence: 80      # ≥ 80 일 때만 alert (false positive 억제)

  # Trigger 2: Divergence (fundamentals BUY/HOLD + technicals SELL)
  # consensus.py:401-430 entry-time penalty 와 동일 로직, holding 에 적용.
  # 70 으로 더 일찍 surface — divergence 는 softer "review me" 신호.
  divergence_min_tech_confidence: 70

  # Dedup window — same (ticker, trigger_type) 는 N 일 동안 재발동 안 함.
  # pipeline_events 자체가 state journal — 별도 dedup 테이블 만들지 않음.
  dedup_calendar_days: 7

  # Asset class scope (v1: US + KR equities only).
  # crypto 는 별도 trigger 로직 (volatility profile 다름) — 추후 PR.
  asset_class_scope:
    - equity_us
    - equity_kr

  # Data gap handling — TechnicalAgent fail / yfinance empty 시 skip + warn.
  # run-summary event payload 에 failed_count 포함, user-facing alert 안 함.
  on_data_gap: skip_and_log
