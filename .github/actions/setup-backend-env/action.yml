name: "Setup backend env"
description: "Install uv, TA-Lib (cached), and backend dependencies (cached venv)"

inputs:
  python-version:
    description: "Python version for uv to install"
    required: false
    default: "3.12"

runs:
  using: "composite"
  steps:
    # 캐시 키에 러너 **이미지 버전**을 넣는다 (#14748). `runner.os` 는 ubuntu-24.04 와
    # 26.04 에서 똑같이 `Linux` 라, 그것만으로는 24.04 에서 만든 venv/TA-Lib 가 26.04
    # 러너에 cache-hit 으로 복원되고 `if: cache-hit != 'true'` 설치가 건너뛰어진다.
    # 실측(run 35591177648, ubuntu-26.04): 백엔드 8 샤드 + e2e seed 가 전부
    # `.venv/bin/python: No such file` → exit 127.
    # ⚠️ `env.ImageOS` 로는 안 된다 — `env` 컨텍스트는 워크플로/잡/스텝의 `env:`
    # 블록만 담고 러너 프로세스 환경변수는 없다. 빈 문자열로 풀려 키가 `Linux--` 가
    # 되고, "새 키라 cold" 라서 우연히 통과할 뿐 OS 를 구분하지 못한다 (run 35591658464).
    # 셸에서 읽어 output 으로 넘기는 이 경로만 실제 값을 준다.
    - name: Resolve runner image id
      id: image
      shell: bash
      run: echo "id=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ inputs.python-version }}
        # setup-uv 의 auto-cache 비활성. 이유: setup-uv 의 cache key 가
        # uv.lock 으로 묶여 있어 lockfile 1 줄 변경 시 venv + uv 캐시 모두 miss
        # → 4 shards 각각 PyPI 에서 221 packages 재다운로드 (cold ~3min).
        # 아래 별도 actions/cache 가 broad restore-keys 로 lockfile churn 에도
        # uv 캐시 hit 보장 (codex consult uv-cache-pattern-2026-05-05 §codex).
        enable-cache: false

    # uv tool 캐시 (wheel 다운로드 저장소). venv cache miss 시 uv sync 가
    # 이 디렉토리에서 wheel 을 link → PyPI 다운로드 skip → 2:50 → ~30s.
    # restore-keys 가 broad 매칭이라 lockfile 변경에도 가장 가까운 캐시 reuse.
    - name: Cache uv tool dir
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/uv-cache
        key: uv-tool-${{ runner.os }}-${{ steps.image.outputs.id }}-py${{ inputs.python-version }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-tool-${{ runner.os }}-${{ steps.image.outputs.id }}-py${{ inputs.python-version }}-

    - name: Set UV_CACHE_DIR
      shell: bash
      run: echo "UV_CACHE_DIR=${{ runner.temp }}/uv-cache" >> "$GITHUB_ENV"

    - name: Cache TA-Lib
      id: cache-talib
      uses: actions/cache@v5
      with:
        path: /tmp/talib-installed
        key: talib-0.4.0-${{ runner.os }}-${{ steps.image.outputs.id }}-v5

    - name: Build TA-Lib from source
      if: steps.cache-talib.outputs.cache-hit != 'true'
      shell: bash
      run: |
        wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
        tar -xzf ta-lib-0.4.0-src.tar.gz
        cd ta-lib && ./configure --prefix=/usr && make && sudo make install
        mkdir -p /tmp/talib-installed
        sudo cp /usr/lib/libta_lib* /tmp/talib-installed/
        sudo cp -r /usr/include/ta-lib /tmp/talib-installed/

    - name: Restore TA-Lib from cache
      if: steps.cache-talib.outputs.cache-hit == 'true'
      shell: bash
      run: |
        sudo cp /tmp/talib-installed/libta_lib* /usr/lib/
        sudo mkdir -p /usr/include/ta-lib
        sudo cp /tmp/talib-installed/ta-lib/* /usr/include/ta-lib/ 2>/dev/null || true
        # Fix symlink to avoid ldconfig warning
        sudo ln -sf /usr/lib/libta_lib.so.0.0.0 /usr/lib/libta_lib.so.0 2>/dev/null || true

    - name: Configure TA-Lib
      shell: bash
      run: sudo ldconfig 2>/dev/null

    - name: Cache venv
      id: cache-venv
      uses: actions/cache@v5
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.image.outputs.id }}-py${{ inputs.python-version }}-${{ hashFiles('uv.lock') }}
        # uv.lock 이 살짝 바뀌어도 (예: pytest-shard → pytest-split, 1줄 diff)
        # venv cache 가 완전 miss → 221 패키지 재설치를 막기 위한 fallback.
        # 부분 hit 면 uv sync 가 변경된 패키지만 install (~수초).
        restore-keys: |
          venv-${{ runner.os }}-${{ steps.image.outputs.id }}-py${{ inputs.python-version }}-

    - name: Install deps
      if: steps.cache-venv.outputs.cache-hit != 'true'
      shell: bash
      # restore-keys 로 일부 복원되었거나 빈 .venv 라면 uv sync 가 ① uv 캐시
      # (~/.cache/uv) 에서 wheel 즉시 link → 다운로드 skip, ② 변경된 deps 만 추가.
      # local-llm extra 는 의도적으로 제외한다. GGUF 없는 CI 가 llama.cpp sdist 를
      # 각 shard 에서 중복 컴파일하지 않도록 한다 (#1406).
      # Test: tests/scripts/test_local_llm_extra.py::TestLocalLlmExtraPolicy::test_ci_excludes_local_llm
      run: uv sync --frozen --extra dev
