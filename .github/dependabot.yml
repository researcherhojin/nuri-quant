version: 2
# Grouped dependency updates — reduces PR noise by bundling related
# minor/patch updates into a single PR per ecosystem.
# Major version bumps still get individual PRs (manual review required).
updates:
  # ─── Python (uv) ────────────────────────────────────────
  # `pip` 이 아니라 `uv` 다 (#1349). dependabot-core 의 pip file fetcher 는
  # Pipfile.lock / poetry.lock / pdm.lock 3개만 알고 `uv.lock` 이라는 문자열이
  # 아예 없다 — 그래서 pip 로는 제안이 항상 pyproject 한 줄짜리가 되고, CI 의
  # `uv sync --frozen` 은 그 불일치를 검사하지 않아 **제안된 버전이 설치된 적
  # 없는 채 전부 green** 이 된다 (#1341 이 그 사고였다). uv ecosystem 은 실제로
  # `uv lock --upgrade-package <dep>` 를 돌려 pyproject + uv.lock 2파일을 내고,
  # 해결 불가한 bump 는 제안 단계에서 걸러 PR 자체를 열지 않는다.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
    # fastapi: pinned to 0.128.x by openbb-core (#277). Ignore dependabot
    # proposals to bump past 0.129 until openbb relaxes its constraint.
    # ruff: openbb-core 1.6.7 이 ruff>=0.15,<0.16 을 하드 핀 — 0.16+ 은 `uv lock`
    # 이 resolve 못 한다 (#1341 close). uv ecosystem 으로 옮긴 뒤로는 resolver 가
    # 제안 단계에서 걸러 PR 이 안 열리므로 이 ignore 는 belt-and-braces 지만,
    # 해결 불가가 조용한 no-op 이 아니라 job failure 로 뜨는 열린 버그가 있어
    # (dependabot-core#15603) 명시 ignore 가 더 싸다. cap 이 풀리면 이 ignore 와
    # pyproject.toml 의 정확 핀을 같이 올릴 것.
    ignore:
      - dependency-name: "fastapi"
        versions: [">=0.129.0"]
      - dependency-name: "ruff"
        versions: [">=0.16.0"]
    groups:
      # Bundle all dev tooling (ruff/pytest/coverage) into one PR
      python-dev:
        applies-to: version-updates
        patterns:
          - "ruff*"
          - "pytest*"
          - "coverage*"
        update-types:
          - "minor"
          - "patch"
      # Bundle data-collection libraries
      python-data:
        applies-to: version-updates
        patterns:
          - "pandas*"
          - "numpy*"
          - "scipy*"
          - "pyarrow*"
        update-types:
          - "minor"
          - "patch"
      # Bundle FastAPI ecosystem
      python-api:
        applies-to: version-updates
        patterns:
          - "fastapi*"
          - "uvicorn*"
          - "httpx*"
          - "pydantic*"
        update-types:
          - "minor"
          - "patch"

  # ─── Frontend (npm) ─────────────────────────────────────
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
    # typescript 7 (Go 네이티브 재작성) 은 아직 툴체인 미지원 (#878):
    # next build 가 typescript 패키지를 인식 못 하고, typescript-eslint 는
    # `Cannot read properties of undefined (reading 'Cjs')` 로 죽는다.
    # Next.js / typescript-eslint 가 TS7 을 지원하면 이 ignore 를 제거할 것.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      # Bundle React family FIRST (peer-dependency couple — prevent ERESOLVE
      # like #665 where react-dom 19.2.6 was bumped alone, leaving react at
      # 19.2.5 and breaking the peer constraint).
      # Dependabot uses first-match-wins ordering. This block MUST sit above
      # `types:` so @types/react* land in react-family instead of the generic
      # @types/* bucket.
      react-family:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      # Bundle all @types/* into one PR (always safe). Catches the remainder
      # after `react-family` claims its @types/react* slice above.
      types:
        applies-to: version-updates
        patterns:
          - "@types/*"
      # Bundle test tooling
      frontend-test:
        applies-to: version-updates
        patterns:
          - "vitest*"
          - "@vitest/*"
          - "@testing-library/*"
          - "@playwright/*"
          - "playwright"         # standalone package (defensive — @playwright/test pulls it in)
        update-types:
          - "minor"
          - "patch"
      # Bundle build/lint tooling
      frontend-build:
        applies-to: version-updates
        patterns:
          - "eslint*"
          - "tailwindcss*"
          - "@tailwindcss/*"
          - "typescript*"
        update-types:
          - "minor"
          - "patch"

  # ─── GitHub Actions ─────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      # Bundle all GitHub Actions updates into one PR per month
      actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
