version: 2
# Grouped dependency updates — reduces PR noise by bundling related
# minor/patch updates into a single PR per ecosystem.
# Major version bumps still get individual PRs (manual review required).
updates:
  # ─── Python (uv/pip) ────────────────────────────────────
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
    # fastapi: pinned to 0.128.x by openbb-core (#277). Ignore dependabot
    # proposals to bump past 0.129 until openbb relaxes its constraint.
    ignore:
      - dependency-name: "fastapi"
        versions: [">=0.129.0"]
    groups:
      # Bundle all dev tooling (ruff/pytest/coverage) into one PR
      python-dev:
        applies-to: version-updates
        patterns:
          - "ruff*"
          - "pytest*"
          - "coverage*"
        update-types:
          - "minor"
          - "patch"
      # Bundle data-collection libraries
      python-data:
        applies-to: version-updates
        patterns:
          - "pandas*"
          - "numpy*"
          - "scipy*"
          - "pyarrow*"
        update-types:
          - "minor"
          - "patch"
      # Bundle FastAPI ecosystem
      python-api:
        applies-to: version-updates
        patterns:
          - "fastapi*"
          - "uvicorn*"
          - "httpx*"
          - "pydantic*"
        update-types:
          - "minor"
          - "patch"

  # ─── Frontend (npm) ─────────────────────────────────────
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
    # typescript 7 (Go 네이티브 재작성) 은 아직 툴체인 미지원 (#878):
    # next build 가 typescript 패키지를 인식 못 하고, typescript-eslint 는
    # `Cannot read properties of undefined (reading 'Cjs')` 로 죽는다.
    # Next.js / typescript-eslint 가 TS7 을 지원하면 이 ignore 를 제거할 것.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      # Bundle React family FIRST (peer-dependency couple — prevent ERESOLVE
      # like #665 where react-dom 19.2.6 was bumped alone, leaving react at
      # 19.2.5 and breaking the peer constraint).
      # Dependabot uses first-match-wins ordering. This block MUST sit above
      # `types:` so @types/react* land in react-family instead of the generic
      # @types/* bucket.
      react-family:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      # Bundle all @types/* into one PR (always safe). Catches the remainder
      # after `react-family` claims its @types/react* slice above.
      types:
        applies-to: version-updates
        patterns:
          - "@types/*"
      # Bundle test tooling
      frontend-test:
        applies-to: version-updates
        patterns:
          - "vitest*"
          - "@vitest/*"
          - "@testing-library/*"
          - "@playwright/*"
          - "playwright"         # standalone package (defensive — @playwright/test pulls it in)
        update-types:
          - "minor"
          - "patch"
      # Bundle build/lint tooling
      frontend-build:
        applies-to: version-updates
        patterns:
          - "eslint*"
          - "tailwindcss*"
          - "@tailwindcss/*"
          - "typescript*"
        update-types:
          - "minor"
          - "patch"

  # ─── GitHub Actions ─────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      # Bundle all GitHub Actions updates into one PR per month
      actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
