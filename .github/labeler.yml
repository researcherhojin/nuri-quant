# Auto-label PRs based on changed files (actions/labeler@v6 format).
# Each label only catches the most specific path; broader labels add coverage.

backend:
  - changed-files:
      - any-glob-to-any-file:
          - "nuri/**"
          - "tests/**"
          - "pyproject.toml"
          - "uv.lock"

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - "frontend/**"

pipeline:
  - changed-files:
      - any-glob-to-any-file:
          - "nuri/collectors/**"
          - "nuri/quant/**"
          - "nuri/trading/**"
          - "nuri/analysis/**"

agents:
  - changed-files:
      - any-glob-to-any-file:
          - "nuri/trading/agents/**"
          - "config/agents.yaml"

api:
  - changed-files:
      - any-glob-to-any-file:
          - "nuri/api/**"

llm:
  - changed-files:
      - any-glob-to-any-file:
          - "nuri/llm/**"

evidence:
  # 2026-04-15 Codex audit: previous 5 paths were ALL stale (non-existent files).
  # Replaced with the actual evidence-related modules.
  - changed-files:
      - any-glob-to-any-file:
          - "nuri/analysis/evidence_charts.py"
          - "frontend/src/app/evidence/**"
          - "frontend/src/__tests__/pages/evidence.test.tsx"

kis:
  - changed-files:
      - any-glob-to-any-file:
          - "nuri/collectors/kis_*.py"
          - "docs/KIS_INTEGRATION.md"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"
          - "frontend/**/__tests__/**"
          - "frontend/e2e/**"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "codecov.yml"
          - "Makefile"

dx:
  # Developer experience: scripts that improve dev workflow
  - changed-files:
      - any-glob-to-any-file:
          - "scripts/ci_local.sh"
          - "scripts/check_drift.py"
          - "scripts/check_atomic.sh"
          - "scripts/pre_push_check.sh"
          - "docs/DX_GUIDE.md"
          - ".github/pull_request_template.md"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "*.md"
          - "CLAUDE.md"

config:
  - changed-files:
      - any-glob-to-any-file:
          - "config/**"
          - ".env.example"

security:
  # 2026-04-15 Codex audit: `nuri/api/middleware*.py` never existed — the
  # label misrouted or matched nothing. Replaced with the actual security-
  # sensitive modules (auth, privacy scanner, SIEGE gate, policy files).
  - changed-files:
      - any-glob-to-any-file:
          - ".gitignore"
          - "config/rules.yaml"
          - "nuri/api/auth.py"
          - "scripts/gate_check.py"
          - "scripts/check_privacy_leak.py"
          - "SECURITY.md"
