name: Feature Request
description: Propose a new feature or enhancement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Link to STRATEGY.md principle if applicable.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work?
    validations:
      required: true

  - type: textarea
    id: done_when
    attributes:
      label: Done when
      description: Completion criteria, each checkable by a command or a measurement. Review judges the diff against every item (STRATEGY.md §2.7).
      placeholder: |
        - `make test-fast` passes, including a new test that fails without the change
        - `/api/...` returns ...
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Related changes this issue deliberately leaves out.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Pipeline
        - Agents
        - Trading
        - API
        - Dashboard
        - Database
        - CI/CD
        - Other

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High (blocks current workflow)
        - Medium (improves existing workflow)
        - Low (nice to have)
