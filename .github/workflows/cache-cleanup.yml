name: Cache Cleanup

# 닫힌 PR 의 actions cache 는 재사용될 일이 없는데 ref 별로 남아 repo 10GB 한도를
# 잠식한다 — 2026-09-02 실측: 닫힌 PR 7개가 6.1GB 를 물고 있어 main 의 살아있는
# 캐시(venv/uv-tool)가 LRU 로 축출되고 있었다 (총 15.4GB 중 죽은 캐시 14GB).
# main 의 세대 교체분(uv.lock 해시 키)은 GitHub 의 7일 미사용 자동 축출이 처리하므로
# 여기서는 PR ref 만 지운다.
#
# PR 이 닫힐 때의 즉시 삭제는 GITHUB_TOKEN 이 머지한 PR(dependabot auto-merge)에서 시작되지
# 않는다 — GitHub 는 GITHUB_TOKEN 이 일으킨 이벤트로 워크플로를 띄우지 않는다 (#1812). 그렇게
# 남은 캐시가 2026-10-12 에 4.8GB 였다. 그래서 매일 한 번 닫힌 PR 의 캐시를 쓸어낸다
# (scripts/ci/sweep_closed_pr_caches.sh). cron 은 정시를 피해 03:41 UTC.
on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    name: Delete closed PR caches
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Delete caches for this PR ref
        env:
          GH_TOKEN: ${{ github.token }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -e
          IDS=$(gh api "repos/${{ github.repository }}/actions/caches?ref=${REF}&per_page=100" --jq '.actions_caches[].id')
          COUNT=0
          for ID in $IDS; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/caches/${ID}" && COUNT=$((COUNT+1))
          done
          echo "deleted ${COUNT} cache(s) for ${REF}"

  sweep:
    name: Sweep caches of closed PRs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Delete caches whose PR is closed
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/sweep_closed_pr_caches.sh
