name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Workflow-level default permissions: read-only.
# Jobs that need write access (e.g., to upload to Codecov via token) opt in
# explicitly. Resolves CodeQL `actions/missing-workflow-permissions` alerts.
permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ─── Quick checks (5MB file gate) — moved from pr-checks.yml ───
  # Single-purpose, always-run, 빠름. PR 에 5MB+ 파일 들어오는 것 차단.
  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Reject files over 5MB
        run: |
          LARGE=$(find . -type f \
            -not -path './.git/*' \
            -not -path './frontend/node_modules/*' \
            -not -path './.venv/*' \
            -not -path './data/*' \
            -size +5M 2>/dev/null)
          if [ -n "$LARGE" ]; then
            echo "::error::Files over 5MB found:"
            echo "$LARGE"
            exit 1
          fi

  # ─── Change detection ───
  # All 5 required jobs (Backend Tests, Backend Lint, Frontend Tests, Frontend Build,
  # Security Scan) ALWAYS run so their check names report to branch protection. But
  # the expensive steps inside each are gated by these filter outputs — frontend-only
  # PRs skip backend work (and vice versa), reporting SUCCESS in ~10s instead of 3min.
  # Push to main always runs everything (no PR context to filter on).

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      # ── Policy outputs (Stage 2c) ──
      # Collapse the repeated `X == 'true' || !pull_request` pattern into
      # single booleans. Skip-notice steps use the inverse (`run_X != 'true'`),
      # which is equivalent to `X != 'true' && PR` because run_X is always
      # 'true' on push / workflow_dispatch (the non-PR triggers this workflow
      # listens to).
      run_backend: ${{ steps.filter.outputs.backend == 'true' || github.event_name != 'pull_request' }}
      run_frontend: ${{ steps.filter.outputs.frontend == 'true' || github.event_name != 'pull_request' }}
      run_security: ${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.frontend == 'true' || github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'nuri/**'
              - 'tests/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Makefile'
              - 'config/**'
              - '.github/workflows/**'
              - '.github/actions/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
              - '.github/actions/**'

  # ─── Frontend ───

  frontend-tests:
    name: Frontend Tests
    needs: changes
    # See backend-lint for rationale — guard ensures `changes` failure doesn't
    # silently false-green this required check via GitHub's skipped==passed policy.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # NOTE: defaults.run.working-directory only applies to `run` steps, NOT `uses` steps.
    # All `uses` step paths (codecov, cache, etc.) must use repo-root-relative paths.
    defaults:
      run:
        working-directory: frontend
    steps:
      # Guard runs BEFORE checkout. Job-level `defaults.run.working-directory: frontend`
      # WOULD apply to this run step (and fail cd-ing into non-existent `frontend/`
      # pre-checkout), so we override to `.` (= $GITHUB_WORKSPACE, the empty runner dir).
      - name: Guard — require changes to succeed
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::changes job did not succeed (result=${{ needs.changes.result }}) — cannot verify gates"
          exit 1

      # Always checkout — skip notice runs `echo` which would otherwise try to
      # `cd frontend` (per defaults.run.working-directory) into a non-existent dir.
      - uses: actions/checkout@v7

      - name: Skip notice (no frontend changes)
        if: needs.changes.outputs.run_frontend != 'true'
        run: echo "✓ No frontend changes — fast-pass to satisfy required check"

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.run_frontend == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - if: needs.changes.outputs.run_frontend == 'true'
        run: npm ci

      - name: Type check
        if: needs.changes.outputs.run_frontend == 'true'
        run: npx tsc --noEmit

      - name: Run tests with coverage
        if: needs.changes.outputs.run_frontend == 'true'
        run: npx vitest run --coverage

      - name: Verify and fix coverage paths
        if: needs.changes.outputs.run_frontend == 'true'
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "::error::coverage/lcov.info not found — vitest coverage may have failed"
            ls -la coverage/ 2>/dev/null || echo "coverage/ directory does not exist"
            exit 1
          fi
          echo "✓ coverage/lcov.info found ($(wc -l < coverage/lcov.info) lines)"
          # vitest outputs paths relative to frontend/ (e.g. SF:src/...).
          # Codecov needs repo-root-relative paths (SF:frontend/src/...).
          sed -i 's|^SF:src/|SF:frontend/src/|' coverage/lcov.info
          echo "✓ Paths rewritten to repo-root-relative"
          head -3 coverage/lcov.info

      - name: Upload coverage to Codecov
        if: needs.changes.outputs.run_frontend == 'true' && always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # uses steps ignore defaults.run.working-directory — must be repo-root-relative
          files: frontend/coverage/lcov.info
          flags: frontend
          disable_search: true
          fail_ci_if_error: false

  frontend-build:
    name: Frontend Build
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Guard — require changes to succeed
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::changes job did not succeed (result=${{ needs.changes.result }}) — cannot verify gates"
          exit 1

      - uses: actions/checkout@v7

      - name: Skip notice (no frontend changes)
        if: needs.changes.outputs.run_frontend != 'true'
        run: echo "✓ No frontend changes — fast-pass to satisfy required check"

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.run_frontend == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - if: needs.changes.outputs.run_frontend == 'true'
        run: npm ci

      - name: Production build
        if: needs.changes.outputs.run_frontend == 'true'
        run: npm run build

  # Frontend lint (eslint). Phase 1 (#470): errors-only gate; warnings tolerated
  # while the existing 193 `any`/unused warnings are paid down. Promotion to
  # `--max-warnings=0` is a separate cleanup PR. Default `npm run lint` already
  # exits non-zero on errors, so `npm run lint` is sufficient here.
  frontend-lint:
    name: Frontend Lint
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Guard — require changes to succeed
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::changes job did not succeed (result=${{ needs.changes.result }}) — cannot verify gates"
          exit 1

      - uses: actions/checkout@v7

      - name: Skip notice (no frontend changes)
        if: needs.changes.outputs.run_frontend != 'true'
        run: echo "✓ No frontend changes — fast-pass to satisfy required check"

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.run_frontend == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - if: needs.changes.outputs.run_frontend == 'true'
        run: npm ci

      - name: ESLint (errors-only gate)
        if: needs.changes.outputs.run_frontend == 'true'
        run: npm run lint

  frontend-e2e:
    name: Frontend E2E
    needs: changes
    # frontend-tests 와 동일 가드 — changes 실패가 skipped==passed 로 false-green 되는 것 방지.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # playwright.config.ts webServer 가 job env 를 상속해 uvicorn 이 이 DB 를 읽는다 (#1240).
      NURI_DB_PATH: ${{ github.workspace }}/data/e2e-seed.db
    steps:
      - name: Guard — require changes to succeed
        if: needs.changes.result != 'success'
        run: |
          echo "::error::changes job did not succeed (result=${{ needs.changes.result }}) — cannot verify gates"
          exit 1

      # e2e 는 프론트(스펙·페이지)와 백엔드(API 응답 형태) 양쪽에 걸친 스위트라 둘 중
      # 하나라도 바뀌면 돈다. 선행 조건 2건이 풀리며 배선됐다 (#1234):
      #   #1119 heavy-slot 게이트 — 스위트가 자기 부하로 백엔드를 포화시키던 문제
      #   #1240 seed DB — CI 에 populated DB 가 없어 data-dependent 스펙이 불가하던 문제
      - name: Skip notice (no frontend/backend changes)
        if: needs.changes.outputs.run_frontend != 'true' && needs.changes.outputs.run_backend != 'true'
        run: echo "✓ No frontend/backend changes — e2e fast-pass"

      - uses: actions/checkout@v7
        if: needs.changes.outputs.run_frontend == 'true' || needs.changes.outputs.run_backend == 'true'

      - name: Setup backend env (uv + TA-Lib + venv)
        if: needs.changes.outputs.run_frontend == 'true' || needs.changes.outputs.run_backend == 'true'
        uses: ./.github/actions/setup-backend-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Seed synthetic e2e DB (#1240)
        if: needs.changes.outputs.run_frontend == 'true' || needs.changes.outputs.run_backend == 'true'
        run: |
          mkdir -p data
          .venv/bin/python scripts/dev/seed_e2e_db.py --db "$NURI_DB_PATH"

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.run_frontend == 'true' || needs.changes.outputs.run_backend == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        if: needs.changes.outputs.run_frontend == 'true' || needs.changes.outputs.run_backend == 'true'
        working-directory: frontend
        run: npm ci

      - name: Install Playwright chromium
        if: needs.changes.outputs.run_frontend == 'true' || needs.changes.outputs.run_backend == 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # playwright.config.ts 가 두 서버(uvicorn :8001 / next dev :3000)를 직접 띄운다.
      # 로컬 실측 1.4m (M5 Max, warm) — 4-core 러너 + next dev cold compile 여유를 3배 이상 둔다.
      - name: Run Playwright suite
        if: needs.changes.outputs.run_frontend == 'true' || needs.changes.outputs.run_backend == 'true'
        working-directory: frontend
        run: npx playwright test
        timeout-minutes: 18

      # playwright-report/ 는 config 의 CI 한정 HTML reporter 가, test-results/ 는
      # screenshot: only-on-failure 가 만든다 — 서버 기동 실패처럼 둘 다 없는
      # 실패도 있으므로 if-no-files-found 는 기본(warn) 그대로 둔다.
      - name: Upload playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # ─── Backend ───

  backend-lint:
    name: Backend Lint
    needs: changes
    # if: !cancelled() ensures this job runs even if `changes` failed or was skipped,
    # so the guard step below can fail the required check explicitly. Without this,
    # a failed `changes` would mark downstream jobs as skipped, which branch protection
    # treats as passed → false green.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guard — require changes to succeed
        if: needs.changes.result != 'success'
        run: |
          echo "::error::changes job did not succeed (result=${{ needs.changes.result }}) — cannot verify gates"
          exit 1

      - name: Skip notice (no backend changes)
        if: needs.changes.outputs.run_backend != 'true'
        run: echo "✓ No backend changes — fast-pass to satisfy required check"

      - uses: actions/checkout@v7
        if: needs.changes.outputs.run_backend == 'true'

      - uses: astral-sh/ruff-action@v4.1.0
        if: needs.changes.outputs.run_backend == 'true'
        with:
          args: "check nuri/ tests/ scripts/"

  # ── Privacy leak scan (#138) ──
  # Always runs (no `needs: changes` gate) — a frontend-only PR could still
  # introduce a markdown leak. Scanner uses stdlib only, no deps.
  privacy-scan:
    name: Privacy Leak Scan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      # stdlib only — no setup-python needed (ubuntu runner has Python pre-installed)
      - name: Scan for personal financial data leaks
        run: python3 scripts/verify/check_privacy_leak.py

  # ── Shell script lint ──
  # shellcheck로 scripts/ 하위 **전체** .sh 린트. Graduated from warning-only 2026-04-15 —
  # passed cleanly across multiple consecutive runs (docs/TODO.md Tier 1 #7
  # shipped 16 files clean). Failures now block the job, but the check
  # is still not in required_status_checks (branch protection update is a
  # separate manual step when user chooses to enforce).
  # Cost: ~10s, no deps (Ubuntu runner has shellcheck preinstalled).
  shell-lint:
    name: Shell Lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        # `scripts/*.sh` 는 7개 하위 디렉터리로 옮긴 뒤 27개 중 1개(_common.sh)만
        # 잡았다 — required check 가 사실상 비어 있었다. find 로 재귀 수집한다.
        run: find scripts -name '*.sh' -exec shellcheck --source-path=SCRIPTDIR --external-sources {} +

  # ── Doc count drift gate ──
  # verify_doc_counts.sh checks that numeric claims in CLAUDE.md / README.md /
  # docs/ARCHITECTURE.md / docs/STRATEGY.md / nuri/collectors/CLAUDE.md match
  # live code (collectors, endpoints, test file counts, e2e spec count).
  # Runs in <1s — no Python env needed (find + grep only). Always-run so
  # docs/gitignore-only PRs also report status (see CLAUDE.md "Branch
  # protection conditional skip trap"). Currently **advisory** — not added to
  # required_status_checks in this PR. Promotion to required is a separate
  # manual step once the check has been observed clean for N consecutive merges
  # (STRATEGY §2.6 — soft penalty before hard veto).
  doc-counts-verify:
    name: Doc Count Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Verify doc counts match live code
        run: bash scripts/verify/verify_doc_counts.sh

  # ── Universe + Agent Coverage Validation (#272 Phase 2c) ──
  # Validates universe.yaml ↔ upstream sync. CI 에서는 universe.yaml 의 ticker
  # count sanity check 만 수행 (DB 부재). 5-table coverage 검증 (prices /
  # fundamentals / analyst / insider / superinvestors) 은 로컬 또는 Mac mini
  # scheduler 가 수행하며 `scripts/doc/validate_universe.py --no-fetch` 로 5/5 PASS
  # 가 유지되어야 함 (2026-04-16 마지막 실측 99/99/97/97/97%).
  #
  # **Required gate** — TODO.md Tier 2 P2 #7 에 따라 promotion 됨. universe.yaml
  # 의 라벨 vs reality drift (예: us_sp500_extended 가 503→339 으로 silently
  # 줄어듦) 를 PR 단계에서 차단. branch protection required check 에 추가됨.
  universe-check:
    name: Universe Coverage Validation
    needs: changes
    # Always run — required gate (PR #343 promoted this to required_status_checks).
    # Previous changes-conditional caused docs/gitignore-only PRs to report
    # this check as "skipping", which blocks merge under the new required-check
    # policy. The job is fast (~15s, no network), so always-on cost is trivial
    # vs the merge-block cost.
    #
    # `!cancelled()` + the guard step below are what make "always run" true.
    # Without them `needs: changes` means a FAILED `changes` job skips this one,
    # and GitHub counts a skipped required check as satisfied — the gate would
    # fail open exactly when the thing that decides what to test is broken.
    # Every other `needs: changes` job here already carries both; this was the
    # only one that did not.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guard — require changes to succeed
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::changes job did not succeed (result=${{ needs.changes.result }}) — cannot verify gates"
          exit 1
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install minimal deps (no full uv sync needed)
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pandas pytest
      - name: Validate universe (cache mode — no network)
        run: |
          # CI에는 DB가 없으므로 universe.yaml 자체 sanity check만
          python -c "
          import yaml
          from pathlib import Path
          u = yaml.safe_load(Path('config/universe.yaml').read_text())
          us = set((u.get('us_core') or {}).get('tickers') or [])
          us |= set((u.get('us_sp500_extended') or {}).get('tickers') or [])
          kr = set((u.get('kr_kospi200') or {}).get('tickers') or [])
          print(f'US universe: {len(us)} tickers')
          print(f'KR universe: {len(kr)} tickers')
          # Sanity thresholds (spec §2.1: ≥95%)
          assert len(us) >= 478, f'US universe {len(us)} < 478 (95% of S&P 500 503)'
          assert len(kr) >= 190, f'KR universe {len(kr)} < 190 (95% of KOSPI 200)'
          print('✅ Universe sanity check PASS')
          "

  # ── Backend Tests — fast/slow split + fast shards ──
  #
  # Architecture (post PR #320 revert + STRATEGY §5.8 #2 "2번 실패하면 접근을
  # 바꾼다"):
  #   1. backend-tests-shard  — fast tests only (-m "not slow"), time-balanced
  #      shard matrix (개수는 아래 job 의 matrix 가 정본). Runs on both PR and
  #      push. Always excludes slow.
  #   2. backend-tests-slow   — slow tests only (-m slow), sharded matrix.
  #      Runs ONLY on push to main (PR still skips slow, matching pre-split
  #      behavior).
  #   3. backend-tests        — aggregator. Reports the "Backend Tests"
  #      required check. needs: [changes, backend-tests-shard, backend-tests-slow].
  #
  # Rationale: #320 tried increasing shards 2→3, but hash-based pytest-shard
  # concentrated slow tests in one bucket (shard 3 = 2m48s, unchanged
  # wall-clock). Splitting by marker isolates the heavy tests from fast ones,
  # so wall-clock becomes max(fast_shard, slow_job) instead of max(shard
  # containing slow). Coverage uploaded from both with distinct flags so
  # Codecov merges correctly.
  #
  # Shard names are "Backend Tests · Fast/Slow <n>" — NOT required checks.
  # Only the aggregator name "Backend Tests" is protected.

  backend-tests-shard:
    name: Backend Tests · Fast ${{ matrix.shard }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Skip notice (no backend changes)
        if: needs.changes.outputs.run_backend != 'true'
        run: echo "✓ No backend changes — shard ${{ matrix.shard }} fast-pass"

      - uses: actions/checkout@v7
        if: needs.changes.outputs.run_backend == 'true'

      - name: Setup backend env (uv + TA-Lib + venv)
        if: needs.changes.outputs.run_backend == 'true'
        uses: ./.github/actions/setup-backend-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # pytest-split (timing-aware) — `pytest-shard` (hash-based) 가 #320 처럼
      # 테스트 런타임 분포가 치우치면 한 shard 가 전체 wall 을 결정. pytest-split
      # 은 `.test_durations` (repo 동봉) 의 historical 시간을 읽어 shard 를
      # 균등 분배. 파일 부재 시 test-count balance 로 degrade 하는데, 그건
      # graceful 하지 않다 — 2026-08-10 실측: shard 1~3 은 전체 job 이 2~3분인데
      # shard 4 는 pytest 단계만 5분 timeout 을 넘겨 PR 2건이 막혔다(#1012·#1015).
      # 파일명은 **언더스코어**다. 하이픈으로 적으면 플러그인이 안 읽고 조용히
      # count-split 으로 떨어진다 — 이 주석 자체가 그렇게 틀려 있었다.
      # 갱신: `make sync-test-durations` (테스트를 크게 추가/삭제한 뒤).
      # Slow tests (23, LLM/scheduler) 는 backend-tests-slow 에서 별도 push-only.

      - name: Run fast tests with coverage
        if: needs.changes.outputs.run_backend == 'true'
        # `--cov-report=` (empty) suppresses XML — backend-coverage-merge 가 모든
        # shard 의 `.coverage` 를 모아 단일 XML 을 만들고 codecov 에 한 번 업로드.
        run: .venv/bin/python -m pytest tests/ -q --tb=short -n auto --dist worksteal -m "not slow and not integration" --splits 6 --group ${{ matrix.shard }} --cov=nuri --cov-branch --cov-report= --cov-report=term
        # 5분은 **관측된 최악값과 같았다** — 그래서 통과/실패가 동전던지기였다.
        # shard 4 실측 4회: 139s · 302s(timeout) · pass · timeout(82% 에서 절단, #1028).
        # timeout 은 예상 최악값 위에 여유를 둬야 하고, 그러면서도 진짜 hang 은
        # 여전히 잡아야 한다 — 정상 최대(~140s)의 3배가 그 절충이다 (#1029).
        timeout-minutes: 8

      - name: Upload .coverage artifact
        if: needs.changes.outputs.run_backend == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-fast-${{ matrix.shard }}
          path: .coverage
          if-no-files-found: ignore
          retention-days: 1
          include-hidden-files: true

  # ── Backend Slow Tests — isolated, push-only ──
  # Runs the 23 @pytest.mark.slow tests (mostly LLM/scheduler) in a single
  # unsharded job. Push-only: PRs deliberately skip slow tests, matching
  # pre-split behavior (see STRATEGY §4.1 — slow excluded from PR CI).
  # Coverage uploaded with flag `backend-slow` so Codecov merges with the
  # fast shards' flag `backend-fast` for full-suite coverage on main.

  backend-tests-slow:
    name: Backend Tests · Slow ${{ matrix.shard }}
    needs: changes
    # Push-only (strict). workflow_dispatch and schedule won't run slow.
    # PR deliberately skips slow (matches pre-split behavior, STRATEGY §4.1).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - name: Setup backend env (uv + TA-Lib + venv)
        uses: ./.github/actions/setup-backend-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run slow tests with coverage
        # 23 slow tests (LLM/scheduler) → 2 shards × xdist 4 workers. 단일 shard
        # 2:16 wall 의 critical path 를 절반 ~1:00-1:15 로 단축 — fast lane (shard
        # 4 분할 후 ~2:11 wall) 과 같은 critical path 안에 들어옴.
        run: .venv/bin/python -m pytest tests/ -q --tb=short -n auto --dist worksteal -m "slow" --splits 2 --group ${{ matrix.shard }} --cov=nuri --cov-branch --cov-report= --cov-report=term
        timeout-minutes: 5

      - name: Upload .coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-slow-${{ matrix.shard }}
          path: .coverage
          if-no-files-found: ignore
          retention-days: 1
          include-hidden-files: true

  # ── Backend Coverage merge ──
  # Single source of truth for codecov: 모든 backend test job 의 `.coverage`
  # artifact 를 다운로드 → `coverage combine` 으로 union → 단일 coverage.xml
  # 을 codecov 에 한 번만 업로드 (flag=backend). 이전엔 shard/slow 가 각각
  # 별도 flag 로 업로드 → codecov multi-session merge 가 phantom miss 생성
  # (#611~#613 history). PR 에선 slow artifact 가 없어 fast 만 합산되며,
  # push 에선 fast+slow 모두 합산.

  backend-coverage-merge:
    name: Backend Tests · Coverage Aggregate
    needs: [changes, backend-tests-shard, backend-tests-slow]
    if: ${{ !cancelled() && needs.changes.outputs.run_backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup backend env (uv + TA-Lib + venv)
        uses: ./.github/actions/setup-backend-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: cov-artifacts

      - name: Combine coverage data
        run: |
          set -e
          mkdir -p cov-merge
          # 각 artifact 디렉토리의 `.coverage` 파일을 unique suffix 로 복사
          # (coverage combine 은 `.coverage.<suffix>` 형태를 union).
          shopt -s nullglob
          found=0
          for d in cov-artifacts/coverage-*/; do
            name=$(basename "$d")
            suffix=${name#coverage-}
            if [ -f "${d}.coverage" ]; then
              cp "${d}.coverage" "cov-merge/.coverage.${suffix}"
              found=$((found + 1))
              echo "✓ ${name} → cov-merge/.coverage.${suffix}"
            else
              echo "⚠ ${name}: .coverage missing — skipped"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no .coverage artifacts found"
            exit 1
          fi
          # combine 은 positional arg 로 받은 디렉토리의 `.coverage*` 를 union 한 뒤
          # cwd 의 `.coverage` 파일에 결과를 기록한다 (없으면 새로 생성).
          .venv/bin/python -m coverage combine cov-merge
          .venv/bin/python -m coverage xml -o coverage.xml
          .venv/bin/python -m coverage report --skip-empty | tail -5

      - name: Upload merged coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: backend
          disable_search: true
          fail_ci_if_error: false

  # ── Backend Tests aggregator ──
  # Single check name "Backend Tests" reported to branch protection. Always
  # runs (if: always()) so the required check always reports.
  #
  # needs both fast shards and slow job. On PR, slow is skipped by design —
  # treated as OK (result=skipped). Only failure/cancelled propagates.
  #
  # ⚠ Keep name EXACTLY "Backend Tests" — that is the protected check.
  # ⚠ Do not rename child jobs to collide with this name.

  backend-tests:
    name: Backend Tests
    needs: [changes, backend-tests-shard, backend-tests-slow]
    # !cancelled() matches the other guarded jobs — aggregator still runs on
    # failure/skip to explicitly fail the required check, but user-cancel
    # propagates rather than wasting runner time aggregating a dead run.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate shard + slow results
        run: |
          changes="${{ needs.changes.result }}"
          fast="${{ needs.backend-tests-shard.result }}"
          slow="${{ needs.backend-tests-slow.result }}"
          echo "changes=$changes fast=$fast slow=$slow"
          # changes must actually succeed — if it failed, downstream jobs will
          # be skipped and we'd false-green (Codex #2 Task A).
          if [[ "$changes" != "success" ]]; then
            echo "::error::changes job did not succeed (result=$changes) — cannot verify downstream"
            exit 1
          fi
          if [[ "$fast" == "failure" || "$fast" == "cancelled" ]]; then
            echo "::error::backend-tests-shard (fast) failed or cancelled"
            exit 1
          fi
          if [[ "$slow" == "failure" || "$slow" == "cancelled" ]]; then
            echo "::error::backend-tests-slow failed or cancelled"
            exit 1
          fi
          echo "✓ backend tests passed (or skipped) — fast=$fast slow=$slow"

  # ─── Security ───

  security-scan:
    name: Security Scan
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guard — require changes to succeed
        if: needs.changes.result != 'success'
        run: |
          echo "::error::changes job did not succeed (result=${{ needs.changes.result }}) — cannot verify gates"
          exit 1

      - name: Skip notice (no code changes)
        if: needs.changes.outputs.run_security != 'true'
        run: echo "✓ No backend/frontend changes — fast-pass to satisfy required check"

      - uses: actions/checkout@v7
        if: needs.changes.outputs.run_security == 'true'

      - name: Run Trivy vulnerability scanner
        if: needs.changes.outputs.run_security == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: 1
          format: table
