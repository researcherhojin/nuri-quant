name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Workflow-level default permissions: read-only.
# Jobs that need write access (e.g., to upload to Codecov via token) opt in
# explicitly. Resolves CodeQL `actions/missing-workflow-permissions` alerts.
permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── Change detection ───
  # All 5 required jobs (Backend Tests, Backend Lint, Frontend Tests, Frontend Build,
  # Security Scan) ALWAYS run so their check names report to branch protection. But
  # the expensive steps inside each are gated by these filter outputs — frontend-only
  # PRs skip backend work (and vice versa), reporting SUCCESS in ~10s instead of 3min.
  # Push to main always runs everything (no PR context to filter on).

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'nuri/**'
              - 'tests/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Makefile'
              - 'config/**'
              - '.github/workflows/main-ci-cd.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/main-ci-cd.yml'

  # ─── Frontend ───

  frontend-tests:
    name: Frontend Tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # NOTE: defaults.run.working-directory only applies to `run` steps, NOT `uses` steps.
    # All `uses` step paths (codecov, cache, etc.) must use repo-root-relative paths.
    defaults:
      run:
        working-directory: frontend
    steps:
      # Always checkout — skip notice runs `echo` which would otherwise try to
      # `cd frontend` (per defaults.run.working-directory) into a non-existent dir.
      - uses: actions/checkout@v6

      - name: Skip notice (no frontend changes)
        if: needs.changes.outputs.frontend != 'true' && github.event_name == 'pull_request'
        run: echo "✓ No frontend changes — fast-pass to satisfy required check"

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
        run: npm ci

      - name: Type check
        if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
        run: npx tsc --noEmit

      - name: Run tests with coverage
        if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
        run: npx vitest run --coverage

      - name: Verify and fix coverage paths
        if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "::error::coverage/lcov.info not found — vitest coverage may have failed"
            ls -la coverage/ 2>/dev/null || echo "coverage/ directory does not exist"
            exit 1
          fi
          echo "✓ coverage/lcov.info found ($(wc -l < coverage/lcov.info) lines)"
          # vitest outputs paths relative to frontend/ (e.g. SF:src/...).
          # Codecov needs repo-root-relative paths (SF:frontend/src/...).
          sed -i 's|^SF:src/|SF:frontend/src/|' coverage/lcov.info
          echo "✓ Paths rewritten to repo-root-relative"
          head -3 coverage/lcov.info

      - name: Upload coverage to Codecov
        if: (needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request') && always()
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # uses steps ignore defaults.run.working-directory — must be repo-root-relative
          files: frontend/coverage/lcov.info
          flags: frontend
          disable_search: true
          fail_ci_if_error: false

  frontend-build:
    name: Frontend Build
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Skip notice (no frontend changes)
        if: needs.changes.outputs.frontend != 'true' && github.event_name == 'pull_request'
        run: echo "✓ No frontend changes — fast-pass to satisfy required check"

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
        run: npm ci

      - name: Production build
        if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
        run: npm run build

  # ─── Backend ───

  backend-lint:
    name: Backend Lint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip notice (no backend changes)
        if: needs.changes.outputs.backend != 'true' && github.event_name == 'pull_request'
        run: echo "✓ No backend changes — fast-pass to satisfy required check"

      - uses: actions/checkout@v6
        if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'

      - uses: astral-sh/ruff-action@v3
        if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        with:
          args: "check nuri/ tests/ scripts/"

  # ── Backend Tests (sharded matrix) ──
  # Tests are split across 2 shards via pytest-shard, each running on its own
  # 4-core runner. Wall time roughly halves vs the single-job design.
  # Shard names are "Backend Tests Shard 1/2" — NOT a required check.
  # The aggregator job below reports the single required check name "Backend Tests".

  backend-tests-shard:
    name: Backend Tests Shard ${{ matrix.shard }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Skip notice (no backend changes)
        if: needs.changes.outputs.backend != 'true' && github.event_name == 'pull_request'
        run: echo "✓ No backend changes — shard ${{ matrix.shard }} fast-pass"

      - uses: actions/checkout@v6
        if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'

      - name: Install uv
        if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false

      - name: Cache TA-Lib
        if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        id: cache-talib
        uses: actions/cache@v5
        with:
          path: /tmp/talib-installed
          key: talib-0.4.0-${{ runner.os }}-v5

      - name: Build TA-Lib from source
        if: (needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request') && steps.cache-talib.outputs.cache-hit != 'true'
        run: |
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib && ./configure --prefix=/usr && make && sudo make install
          mkdir -p /tmp/talib-installed
          sudo cp /usr/lib/libta_lib* /tmp/talib-installed/
          sudo cp -r /usr/include/ta-lib /tmp/talib-installed/

      - name: Restore TA-Lib from cache
        if: (needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request') && steps.cache-talib.outputs.cache-hit == 'true'
        run: |
          sudo cp /tmp/talib-installed/libta_lib* /usr/lib/
          sudo mkdir -p /usr/include/ta-lib
          sudo cp /tmp/talib-installed/ta-lib/* /usr/include/ta-lib/ 2>/dev/null || true

      - name: Configure TA-Lib
        if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        run: sudo ldconfig

      - name: Cache venv
        if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
        id: cache-venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}

      - name: Install deps
        if: (needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request') && steps.cache-venv.outputs.cache-hit != 'true'
        run: uv sync --frozen --extra dev

      # pytest-shard splits tests by hash(test_id) into N buckets. shard-id is
      # 0-indexed but the matrix exposes 1-indexed values for human readability.

      - name: Run tests (PR — no coverage, fast)
        if: needs.changes.outputs.backend == 'true' && github.event_name == 'pull_request'
        run: .venv/bin/python -m pytest tests/ -q --tb=short -n auto --dist worksteal --shard-id=$((${{ matrix.shard }} - 1)) --num-shards=2
        timeout-minutes: 5

      - name: Run tests with coverage (main push)
        if: github.event_name != 'pull_request'
        run: .venv/bin/python -m pytest tests/ -q --tb=short -n auto --dist worksteal --shard-id=$((${{ matrix.shard }} - 1)) --num-shards=2 --cov=nuri --cov-report=xml --cov-report=term
        timeout-minutes: 5

      - name: Upload coverage to Codecov
        # Codecov merges multiple uploads sharing the same flag from the same commit.
        if: github.event_name != 'pull_request' && always()
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: backend
          disable_search: true
          fail_ci_if_error: false

  # ── Backend Tests aggregator ──
  # Single check name "Backend Tests" reported to branch protection. Always runs
  # (even if shards are skipped) so the required check always reports.

  backend-tests:
    name: Backend Tests
    needs: [changes, backend-tests-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate shard results
        run: |
          result="${{ needs.backend-tests-shard.result }}"
          echo "Shards overall result: $result"
          if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
            echo "::error::One or more backend test shards failed"
            exit 1
          fi
          echo "✓ All backend test shards passed (or skipped)"

  # ─── Security ───

  security-scan:
    name: Security Scan
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip notice (no code changes)
        if: needs.changes.outputs.backend != 'true' && needs.changes.outputs.frontend != 'true' && github.event_name == 'pull_request'
        run: echo "✓ No backend/frontend changes — fast-pass to satisfy required check"

      - uses: actions/checkout@v6
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'

      - name: Run Trivy vulnerability scanner
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: 1
          format: table
