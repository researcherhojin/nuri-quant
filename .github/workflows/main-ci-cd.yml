name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ─── Frontend ───

  Frontend Tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: frontend
          disable_search: true
          fail_ci_if_error: false

  Frontend Build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Production build
        run: npm run build

  # ─── Backend ───

  Backend Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check nuri/ tests/ scripts/"

  Backend Tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Cache TA-Lib
        id: cache-talib
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: /tmp/talib-installed
          key: talib-0.4.0-${{ runner.os }}-v5

      - name: Build TA-Lib from source
        if: steps.cache-talib.outputs.cache-hit != 'true'
        run: |
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib && ./configure --prefix=/usr && make && sudo make install
          mkdir -p /tmp/talib-installed
          sudo cp /usr/lib/libta_lib* /tmp/talib-installed/
          sudo cp -r /usr/include/ta-lib /tmp/talib-installed/

      - name: Restore TA-Lib from cache
        if: steps.cache-talib.outputs.cache-hit == 'true'
        run: |
          sudo cp /tmp/talib-installed/libta_lib* /usr/lib/
          sudo mkdir -p /usr/include/ta-lib
          sudo cp /tmp/talib-installed/ta-lib/* /usr/include/ta-lib/ 2>/dev/null || true

      - name: Configure TA-Lib
        run: sudo ldconfig

      - name: Cache venv
        id: cache-venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml') }}

      - name: Create venv + install deps
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          uv venv
          uv pip install -e .

      - name: Run tests with coverage
        run: .venv/bin/python -m pytest tests/ -q --tb=short -x --cov=nuri --cov-report=xml --cov-report=term

      - name: Coverage threshold check
        run: |
          COV=$(grep -oP 'line-rate="\K[0-9.]+' coverage.xml | head -1)
          PCT=$(python3 -c "print(int(float('${COV}') * 100))")
          echo "Coverage: ${PCT}%"
          if [ "$PCT" -lt 40 ]; then
            echo "::error::Coverage ${PCT}% is below 40% threshold"
            exit 1
          fi

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: backend
          disable_search: true
          fail_ci_if_error: false

  # ─── Security ───

  Security Scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: 1
          format: table
