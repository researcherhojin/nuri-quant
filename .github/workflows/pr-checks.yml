name: PR Checks

on:
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quick-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check merge conflicts
        run: |
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Merge conflicts detected"
            exit 1
          fi

      - name: Validate commit messages
        run: |
          COMMITS=$(git log --format="%s" origin/main..HEAD)
          PATTERN="^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?: .+"
          FAILED=0
          while IFS= read -r msg; do
            if [[ -n "$msg" ]] && ! echo "$msg" | grep -qE "$PATTERN"; then
              echo "::warning::Non-conventional commit: $msg"
              FAILED=1
            fi
          done <<< "$COMMITS"
          if [ "$FAILED" -eq 1 ]; then
            echo "::warning::Some commits don't follow conventional format (feat|fix|docs|...)"
          fi

      - name: Check file sizes (max 5MB)
        run: |
          LARGE=$(find . -type f -not -path './.git/*' -not -path './frontend/node_modules/*' \
            -not -path './.venv/*' -not -path './data/*' -size +5M 2>/dev/null)
          if [ -n "$LARGE" ]; then
            echo "::error::Files over 5MB found:"
            echo "$LARGE"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: 1
          format: table

  pr-summary:
    runs-on: ubuntu-latest
    needs: [quick-checks, lint, frontend-check, security-scan]
    if: always()
    permissions:
      pull-requests: write
    steps:
      - name: PR Check Summary
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = [
              { name: 'quick-checks', status: '${{ needs.quick-checks.result }}' },
              { name: 'lint', status: '${{ needs.lint.result }}' },
              { name: 'frontend-check', status: '${{ needs.frontend-check.result }}' },
              { name: 'security-scan', status: '${{ needs.security-scan.result }}' },
            ];

            const icon = (s) => s === 'success' ? '✅' : s === 'skipped' ? '⏭️' : '❌';
            const lines = jobs.map(j => `| ${j.name} | ${icon(j.status)} ${j.status} |`);
            const allPassed = jobs.every(j => j.status === 'success' || j.status === 'skipped');

            const body = [
              `## PR Check Results ${allPassed ? '✅' : '❌'}`,
              '',
              '| Check | Status |',
              '|-------|--------|',
              ...lines,
              '',
              allPassed ? '> All checks passed.' : '> Some checks failed. Please review.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes('PR Check Results'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
