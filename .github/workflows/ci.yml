name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check nuri/ tests/ scripts/"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Cache TA-Lib
        id: cache-talib
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: /tmp/talib-installed
          key: talib-0.4.0-${{ runner.os }}-v5

      - name: Build TA-Lib from source
        if: steps.cache-talib.outputs.cache-hit != 'true'
        run: |
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib && ./configure --prefix=/usr && make && sudo make install
          mkdir -p /tmp/talib-installed
          sudo cp /usr/lib/libta_lib* /tmp/talib-installed/
          sudo cp -r /usr/include/ta-lib /tmp/talib-installed/

      - name: Restore TA-Lib from cache
        if: steps.cache-talib.outputs.cache-hit == 'true'
        run: |
          sudo cp /tmp/talib-installed/libta_lib* /usr/lib/
          sudo mkdir -p /usr/include/ta-lib
          sudo cp /tmp/talib-installed/ta-lib/* /usr/include/ta-lib/ 2>/dev/null || true

      - name: Configure TA-Lib
        run: sudo ldconfig

      - name: Cache venv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml') }}

      - name: Create venv + install deps
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          uv venv
          uv pip install -e .

      - name: Run tests with coverage
        run: .venv/bin/python -m pytest tests/ -q --tb=short -x --cov=nuri --cov-report=xml

      - name: Coverage threshold check
        run: |
          COV=$(.venv/bin/python -m pytest tests/ -q --cov=nuri --cov-report=term 2>/dev/null | grep "^TOTAL" | awk '{print $NF}' | tr -d '%')
          echo "Coverage: ${COV}%"
          if [ -n "$COV" ] && [ "$COV" -lt 50 ]; then
            echo "::error::Coverage ${COV}% is below 50% threshold"
            exit 1
          fi

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
