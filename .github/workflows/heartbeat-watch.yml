# 기계 밖 감시의 감시 절반 — dead-man heartbeat staleness 검사 (#1191 옵션 C).
#
# mini 의 스케줄러가 10분마다 `refs/nuri/heartbeat-mini` (커스텀 ref) 를 갱신한다
# (`nuri/alerts/offbox_heartbeat.py`). 이 워크플로는 GitHub 쪽에서 그 커밋
# 시각의 staleness 를 재고, 임계(45분) 초과 시 #ops Discord webhook 으로 알린다.
# mini 는 인바운드 불가(사설망, API 127.0.0.1 전용)라 pull 감시가 불가능하고,
# 송신자의 어떤 사망도 "침묵" 으로 수렴하는 dead-man 구조가 유일한 형태다.
#
# - 임계 45분 = ping 10분 × 4~5회 결손 여유. 배포의 scheduler bounce(~수 분)와
#   Actions cron 지연(공식적으로 best-effort, 수십 분 늦을 수 있음)을 흡수한다.
# - 침묵이 지속되면 20분 주기로 알림이 반복된다 — 진행 중 prod 장애의 리마인더는
#   #ops 의 역할이라 의도된 동작이다 (stateless 라 dedupe 상태를 두지 않는다).
# - 공개 레포의 스케줄 워크플로는 60일 무활동 시 자동 비활성화된다 — 이 레포는
#   일상 커밋이 있어 해당 없음. 장기 방치 시 이 줄이 그 이유를 알려줄 것.
# - ⚠️ 신규 워크플로의 schedule 은 등록에 실패할 수 있다 — 최초 머지(2026-08-29
#   11:09Z) 후 3시간 동안 schedule 이벤트 0회였고, 같은 레포의 주간 cron(Stale
#   Issues)은 정상이었다. 주석-only 재푸시(#1327)로도 1시간 내 미발화 → `on.schedule`
#   블록 자체를 바꾸는 이 커밋이 2차 재등록 유도다. cron 이 `*/20`(=:00/:20/:40)이
#   아니라 7/27/47분인 이유: GitHub 공식 문서가 정시 등 혼잡 분을 피하라고 권고하고
#   (`*/N` 은 고부하 시 지연·드롭), 20분 간격 자체는 유지해 45분 임계와의 관계
#   (4~5회 결손 여유)를 바꾸지 않는다. 이 파일을 고칠 일이 생기면 머지 후 schedule
#   이벤트가 실제로 뜨는지까지 확인할 것 — dispatch 성공은 cron 등록의 증거가
#   아니다 (green dead gate 의 Actions 판).
name: Heartbeat Watch

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-staleness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check heartbeat staleness and alert on silence
        env:
          DISCORD_WEBHOOK_OPS: ${{ secrets.DISCORD_WEBHOOK_OPS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          THRESHOLD_MIN=45

          # 두 신호를 따로 읽는다 (#1443). scheduler beat 하나만 보면 "머신 꺼짐" 과
          # "머신은 켜졌는데 에이전트 미로드" 가 똑같이 침묵으로 보이는데, **조치가 정반대**다.
          # 2026-09-06 에 실제로 후자를 의도적 종료로 오인해 6h21m 을 방치했다.
          # 커스텀 ref(refs/nuri/…, 브랜치 아님)라 branches API 가 아니라 Git Database
          # API 2단이다: ref → object sha → commit 의 committer date.
          ref_age_min() {
            local sha ts
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/$1" --jq '.object.sha' 2>/dev/null || echo "")
            [ -z "$sha" ] && { echo 99999; return; }
            ts=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${sha}" --jq '.committer.date' 2>/dev/null || echo "")
            [ -z "$ts" ] && { echo 99999; return; }
            echo $(( ( $(date -u +%s) - $(date -u -d "$ts" +%s) ) / 60 ))
          }

          # ref 경로를 **온전히** 적는다 — 조각내면 송신 상수와의 교차 잠금이 깨진다
          # (`tests/alerts/test_offbox_heartbeat.py` 가 이름 동치를 검사한다). 한쪽만
          # rename 되면 감시자는 영원히 "ref 없음" 침묵 알림만 낸다.
          hb_age=$(ref_age_min nuri/heartbeat-mini)   # 스케줄러가 보낸다 (gui LaunchAgent)
          mach_age=$(ref_age_min nuri/machine-mini)   # 시스템 도메인 LaunchDaemon 이 보낸다
          echo "heartbeat: ${hb_age}min · machine: ${mach_age}min (threshold ${THRESHOLD_MIN})"

          if [ "$hb_age" -le "$THRESHOLD_MIN" ]; then
            echo "healthy"
            exit 0
          fi

          # 알림은 의미+영향+조치 순 (alert readability 원칙).
          if [ "$mach_age" -le "$THRESHOLD_MIN" ]; then
            # 머신은 살아서 비트를 보내는데 스케줄러만 침묵 — 사람이 손대야 하는 상태다.
            title="🚨 **mini 는 켜져 있는데 스케줄러가 침묵 ${hb_age}분**"
            impact="영향: 수집·합의·브리프·알림 정지. 머신 비트는 ${mach_age}분 전까지 정상 — 즉 전원/네트워크 문제가 아니다."
            action="조치: gui LaunchAgent 미로드가 유력하다 (#1443, 콘솔 로그인 전까지 미로드). ssh 후 \`launchctl list | grep nuri\` → 비어 있으면 콘솔 로그인 또는 \`launchctl bootstrap gui/\$(id -u) ~/Library/LaunchAgents/com.nuri-quant.scheduler.plist\`."
          elif [ "$mach_age" = "99999" ]; then
            # machine ref 자체가 없다 = 데몬 미설치. 분류를 못 하므로 그렇게 말한다.
            title="🔇 **mini heartbeat 침묵 ${hb_age}분** (머신 비트 미설치)"
            impact="영향: 수집·합의·브리프·알림 정지 가능. 머신 생존 여부를 **구분할 수 없다**."
            action="조치: mini 전원·네트워크 확인. 구분을 켜려면 \`sudo bash scripts/launchd/install_daemons.sh\` (#1443)."
          else
            # 둘 다 침묵 = 머신이 꺼졌거나 네트워크가 끊겼다. 의도적 종료면 무해하다.
            title="🔌 **mini 무응답 ${hb_age}분** (머신 비트도 ${mach_age}분 침묵)"
            impact="영향: 머신 꺼짐 또는 네트워크 단절로 보인다 — 의도적 종료라면 조치 불필요."
            action="조치: 계획된 종료가 아니면 mini 전원·네트워크 확인. 부팅 후에도 조용하면 위 '켜져 있는데 침묵' 알림으로 바뀐다."
          fi

          # 실패해도 job 을 성공 처리하지 않는다 — webhook 죽음도 보여야 한다.
          payload=$(jq -n --arg t "$title" --arg i "$impact" --arg a "$action" \
            '{content: ($t + "\n" + $i + "\n" + $a)}')
          curl -sf -X POST -H "Content-Type: application/json" \
            -d "$payload" "$DISCORD_WEBHOOK_OPS"
          echo "alert sent (heartbeat ${hb_age}min, machine ${mach_age}min)"
