[project]
name = "iris"
version = "0.1.0"
description = "Investment Research & Intelligence System"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.36",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "fredapi>=0.5.1",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "TA-Lib>=0.4.28",
    "pandas-ta>=0.3.14b1",
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    "seaborn>=0.13.0",
    "discord.py>=2.3.0",
    "apscheduler>=3.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.optional-dependencies]
llm = ["httpx>=0.27.0"]
quant = [
    "backtrader>=1.9.78",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "cvxpy>=1.4.0",
]

[tool.setuptools.packages.find]
include = ["iris*"]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
