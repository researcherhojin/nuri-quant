[project]
name = "nuri-quant"
version = "2.0.0"
description = "Open-source quant investment platform — Collect, Validate, Recommend"
requires-python = ">=3.12"
dependencies = [
    # Data collection
    "openbb>=4.6.0",
    "pykrx>=1.2.0",
    "fredapi>=0.5.1",
    "edgartools>=5.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",

    # Analysis + technical indicators
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "TA-Lib>=0.4.28",

    # Portfolio optimization + risk
    "riskfolio-lib>=7.0.0",
    "quantstats>=0.0.60",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "cvxpy>=1.4.0",

    # Backtesting
    "vectorbt>=0.28.0",

    # Visualization
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    "seaborn>=0.13.0",
    "mplfinance>=0.12.0",

    # Alerts + scheduling
    "discord.py>=2.3.0",
    "apscheduler>=3.10.0",

    # API + LLM
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "llama-cpp-python>=0.3.0",

    # Config
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",

    # Testing
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
include = ["nuri*"]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
