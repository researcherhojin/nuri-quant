[project]
name = "nuri-quant"
version = "0.2.0"
description = "Open-source quant investment platform — Collect, Analyze, Consensus, Certify, Track"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [
    { name = "Hojin Lee", email = "researcher.hojin@gmail.com" },
]
keywords = [
    "quant", "investment", "portfolio", "backtest",
    "siege", "trading", "fintech", "openbb",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    # ─── Data collection (collectors) ─────────────────────────
    "beautifulsoup4>=4.12.0",
    "edgartools>=5.0.0",
    "finance-datareader>=0.9.110",  # KOSPI 200 fetch (universe_sync #272)
    "finvizfinance>=1.3.0",
    "fredapi>=0.5.2",
    "openbb>=4.7.1",
    "pykrx>=1.2.4",
    "requests>=2.31.0",
    "yfinance>=1.2.1",
    # ─── Analysis + technical indicators ──────────────────────
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "TA-Lib>=0.4.28",
    # ─── Portfolio optimization + risk ────────────────────────
    # 직접 import 0건이어도 Dependabot direct-scope 와 주간 lag 관측을 여는 direct 선언 — 제거 금지.
    # **Test:** tests/agents/test_maintenance_auditor.py::TestDependencyLag::test_zero_import_direct_deps_stay_in_the_observation_set
    "cvxpy>=1.4.0",
    "quantstats>=0.0.60",
    "riskfolio-lib>=7.2.1",
    # 직접 import 0건이어도 Dependabot direct-scope 와 주간 lag 관측을 여는 direct 선언 — 제거 금지.
    # **Test:** tests/agents/test_maintenance_auditor.py::TestDependencyLag::test_zero_import_direct_deps_stay_in_the_observation_set
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    # ─── Regime modeling (Layer B actor #3 — sticky-HMM, #529 Phase 2) ─
    # Codex consult 2026-05-01: sticky-HMM (diagonal Dirichlet prior on transition
    # matrix) 가 production-ready regime posterior. BOCPD 는 2차 승격 후보.
    "hmmlearn>=0.3.0",
    # ─── Backtesting ──────────────────────────────────────────
    # 직접 import 0건이어도 Dependabot direct-scope 와 주간 lag 관측을 여는 direct 선언 — 제거 금지.
    # **Test:** tests/agents/test_maintenance_auditor.py::TestDependencyLag::test_zero_import_direct_deps_stay_in_the_observation_set
    "vectorbt>=0.28.0",
    # ─── Visualization ────────────────────────────────────────
    "matplotlib>=3.8.0",
    "mplfinance>=0.12.0",
    # security floor — 하한을 올려야 `uv lock` 재해석이 취약 버전으로 되돌아가지 않는다.
    # 12.3.0: 13 CVE (heap OOB write in RankFilter/paste/crop/ImageCmsTransform, PDF·JPEG2000
    # decompression bomb, 폰트 로더 bomb-check 우회 5건). 12.2.0 은 CVE-2026-40192 (FITS GZIP).
    # 직접 import 0건이어도 Dependabot direct-scope 와 주간 lag 관측을 여는 direct 선언 — 제거 금지.
    # **Test:** tests/agents/test_maintenance_auditor.py::TestDependencyLag::test_zero_import_direct_deps_stay_in_the_observation_set
    "pillow>=12.3.0",
    "plotly>=5.18.0",
    "seaborn>=0.13.2",
    # ─── Alerts + scheduling ──────────────────────────────────
    "apscheduler>=3.10.0",
    "discord.py>=2.7.1",
    # ─── API server ───────────────────────────────────────────
    # openbb-core(최신 1.6.10까지) 가 fastapi>=0.128.0,<0.129.0 로 하드 핀하나,
    # 그 핀은 openbb 자체 REST 서버 서브기능용 — nuri 는 openbb 를 라이브러리
    # (obb.*) 로만 쓰고 openbb 의 fastapi 서버를 호출하지 않는다(grep 확인).
    # 따라서 [tool.uv] override 로 fastapi/starlette 를 핀 너머로 강제한다
    # (#277 → starlette ≤1.0.0 Host-header bypass 패치는 starlette≥1.0.1 = fastapi≥0.133
    # 에서만 가능). 런타임 호환 실측: API 545 + 전체 5992 테스트 green.
    "fastapi>=0.128.0",
    "httpx>=0.27.0",
    "uvicorn>=0.32.0",
    # ─── LLM providers ────────────────────────────────────────
    "openai>=2.30.0",
    # ─── Security ─────────────────────────────────────────────
    "bcrypt>=4.0.0",
    "PyJWT>=2.13.0",  # dependabot #66-70 (<2.13.0 보안 패치)
    "slowapi>=0.1.9",
    # ─── Config / Environment ─────────────────────────────────
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "mcp>=2.1.1",
]

[project.optional-dependencies]
local-llm = [
    # Opt-in GGUF fallback. PyPI ships an sdist, so keeping this out of the
    # default runtime avoids compiling llama.cpp independently in every CI job.
    # Dev setup + both Mac mini deploy paths select this extra explicitly.
    # Test: tests/scripts/test_local_llm_extra.py::TestLocalLlmExtraPolicy::test_llama_cpp_is_optional
    "llama-cpp-python>=0.3.0",
]
dev = [
    "pytest>=9.0.3",  # security: CVE-2025-71176 tmpdir handling (Dependabot #16)
    "pytest-cov>=7.1.0",
    # pytest-split: timing-aware test partitioning for the CI shard split
    # (shard 개수는 main-ci-cd.yml 의 matrix 가 정본 — 여기 적으면 드리프트만 만든다, #1413).
    # Replaces pytest-shard (hash-based) which produced unbalanced buckets when
    # test runtimes varied — see #320 history. pytest-split reads `.test_durations`
    # (언더스코어 — 플러그인 기본값. 하이픈으로 적어두면 그 파일은 영영 안 읽힌다)
    # to balance shards by historical duration. 갱신: `make sync-test-durations`.
    "pytest-split>=0.10.0",
    "pytest-xdist>=3.8.0",
    "ruff==0.15.22",  # 정확 핀 — CI ruff-action 이 이 핀을 읽어 로컬/CI 단일 버전 (#1235). 0.16+ 은 openbb-core 가 ruff<0.16 을 하드 핀이라 불가 — cap 이 풀리면 함께 올린다
]

[project.urls]
Homepage = "https://github.com/researcherhojin/nuri-quant"
Repository = "https://github.com/researcherhojin/nuri-quant"
Issues = "https://github.com/researcherhojin/nuri-quant/issues"


# ═══════════════════════════════════════════════════════════════
# uv override — openbb 상위 제약을 우회하여 보안 패치 강제
# ═══════════════════════════════════════════════════════════════
[tool.uv]
override-dependencies = [
    # GHSA-mj87-hwqh-73pj (DoS via multipart preamble/epilogue) +
    # dependabot #71 (<0.0.31) — openbb-core 1.6.7 이 python-multipart>=0.0.22,
    # <0.0.23 로 하드 핀했지만 패치 수준 API 차이 없음 (실측: test suite green).
    # openbb 가 pin 을 완화하면 이 override 제거 가능.
    "python-multipart>=0.0.31",
    # dependabot #61/#62 (aiohttp <3.14.0: 신뢰불가 데이터 역직렬화 +
    # cross-origin redirect 쿠키 유출) — 부모(openbb-core/discord-py/
    # aiohttp-client-cache) 전부 aiohttp 제약 (any) 라 floor 만 강제.
    # 3.13.4 → 3.14.0 minor bump (실측: test suite green).
    # 2026-08-10: floor 를 3.14.3 으로 올림. 3.14.1 이 미해결 권고 3건에
    # 걸려 있었다 (high ≤3.14.2 / medium ≤3.14.1 ×2). floor 만 올리면
    # 되는 이유는 위와 같다 — 부모들이 여전히 any 제약이다.
    "aiohttp>=3.14.3",
    # dependabot #63 (starlette ≤1.0.0 Host header bypass) + #79/#80 (<1.3.1) —
    # 패치는 starlette≥1.3.1 에 존재, fastapi 는 0.133.0 부터 starlette 1.x
    # 허용. openbb-core(최신 1.6.10)까지 fastapi<0.129 하드 핀이나, nuri 는
    # openbb 의 fastapi 서버를 안 쓰므로(라이브러리 전용) override 로 강제.
    # 실측: openbb_core/obb import OK + API + 전체 테스트 green.
    "fastapi>=0.133.0",
    "starlette>=1.3.1",
]


# ═══════════════════════════════════════════════════════════════
# Build (hatchling — egg-info 생성 X, setuptools보다 깔끔)
# ═══════════════════════════════════════════════════════════════
[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nuri"]


# ═══════════════════════════════════════════════════════════════
# pytest
# ═══════════════════════════════════════════════════════════════
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m \"not integration\""
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"'). PR CI excludes; main push runs all.",
    "integration: marks tests that hit real external services (Wikipedia, FDR, yfinance). Run via `make test-integration`. Default test run excludes.",
]
filterwarnings = [
    "ignore::DeprecationWarning:openbb_core.*:",
    "ignore::DeprecationWarning:openbb_congress_gov.*:",
    "ignore::DeprecationWarning:openbb_intrinio.*:",
    "ignore::pydantic.warnings.PydanticDeprecatedSince211:",
    "ignore::pydantic.warnings.PydanticDeprecatedSince212:",
    # runpy.run_module() — 부모 패키지의 transitive import 가 target 을 재등록하면
    # sys.modules.pop 으로도 회피 불가. 실제 source 실행에 영향 없는 cosmetic warning.
    "ignore::RuntimeWarning:runpy",
]


# ═══════════════════════════════════════════════════════════════
# coverage.py
# ═══════════════════════════════════════════════════════════════
# `relative_files = true` 은 .coverage 에 절대 경로 대신 cwd 기준 상대 경로를
# 저장한다. CI 의 multi-job `coverage combine` 워크플로우 (각 shard `.coverage`
# artifact 다운로드 → 합산 → coverage xml) 에서 다음 효과:
#   - 모든 shard 가 동일 상대 경로로 저장 → combine 이 같은 file 식별자로 union
#   - `coverage xml` 이 source path 를 상대로 출력 → codecov 가 path 필터
#     (`flags.backend.paths: [nuri/]`) 매칭 가능 (절대 경로면 매칭 실패)
# 절대 경로 파일을 codecov 에 업로드하면 flag.backend coverage=0% 가 되며 PR
# #614 가 정확히 그 증상이었음 (job log 는 통과처럼 보였음 — 82k XML 송신했지만
# codecov 측에서 nuri/ 파일을 0개로 처리).
[tool.coverage.run]
relative_files = true


# ═══════════════════════════════════════════════════════════════
# ruff (lint + isort)
# ═══════════════════════════════════════════════════════════════
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E402",   # module-import-not-at-top (lazy imports in scheduler etc.)
    "E501",   # line-too-long (기존 코드 스타일 허용)
    "E712",   # true-false-comparison (pandas idiom: df[col] == True)
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402", "F401"]
"tests/**" = ["F401", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["nuri"]
