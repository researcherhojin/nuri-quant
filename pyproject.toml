[project]
name = "nuri-quant"
version = "2.0.0"
description = "Open-source quant investment platform — Collect, Validate, Recommend"
requires-python = ">=3.12"
dependencies = [
    # Data collection
    "openbb>=4.6.0",
    "pykrx>=1.2.0",
    "fredapi>=0.5.1",
    "edgartools>=5.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",

    # Analysis + technical indicators
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "TA-Lib>=0.4.28",

    # Portfolio optimization + risk
    "riskfolio-lib>=7.0.0",
    "quantstats>=0.0.60",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "cvxpy>=1.4.0",

    # Backtesting
    "vectorbt>=0.28.0",

    # Visualization
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    "seaborn>=0.13.0",
    "mplfinance>=0.12.0",

    # Alerts + scheduling
    "discord.py>=2.3.0",
    "apscheduler>=3.10.0",

    # API + LLM
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "llama-cpp-python>=0.3.0",

    # Security
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "slowapi>=0.1.9",

    # Config
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",

    # Testing + Linting
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
include = ["nuri*"]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E402",   # module-import-not-at-top (lazy imports in scheduler etc.)
    "E501",   # line-too-long (기존 코드 스타일 허용)
    "E712",   # true-false-comparison (pandas idiom: df[col] == True)
]

[tool.ruff.lint.isort]
known-first-party = ["nuri"]
